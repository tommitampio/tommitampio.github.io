<!DOCTYPE html>
<html lang="fi"><head><meta charset="utf-8"><meta name="color-scheme" content="dark">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kielipeli – Tommi Tampio</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap">
<style>
:root{--bg:#F2F5F7;--card:#fff;--fg:#14202A;--mut:#566672;--line:#CBD5DC;--navy:#1F5C8B;--soft:#eef2f6;--ok:#2e7d4f;--okbg:#dff3e6;--bad:#c0392b;--badbg:#fbe3e1;--gold:#c68512}
@media (prefers-color-scheme:dark){:root{--bg:#0E151B;--card:#141e26;--fg:#E6ECF0;--mut:#93A3AE;--line:#26343E;--navy:#78B6E4;--soft:#1b2832;--ok:#5cc489;--okbg:#173524;--bad:#ef6f5e;--badbg:#3d1c1a;--gold:#e2ac4a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 "Inter",system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh;display:flex;justify-content:center;padding:18px 14px 40px}
.app{width:100%;max-width:520px}
h1{margin:0 0 2px;font-size:2rem;letter-spacing:-.02em;font-family:"Space Grotesk",sans-serif}
.back{display:inline-block;margin-bottom:14px;color:var(--navy);text-decoration:none;font-size:.9rem}
.sub{color:var(--mut);margin:0 0 18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}
.lbl{font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:0 0 8px;font-weight:600}
.langs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
.langs button{all:unset;cursor:pointer;border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:.95rem;background:var(--card)}
.langs button[aria-pressed="true"]{border-color:var(--navy);background:var(--navy);color:var(--bg);font-weight:600}
.modes{display:grid;gap:10px}
.mode{all:unset;cursor:pointer;display:block;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.mode:hover{border-color:var(--navy)}
.mode b{display:block;font-size:1.05rem}.mode span{color:var(--mut);font-size:.9rem}
.best{color:var(--mut);font-size:.85rem;margin-top:14px;text-align:center}
.top{display:flex;justify-content:space-between;font-size:.85rem;color:var(--mut);margin-bottom:8px}
.bar{height:6px;background:var(--soft);border-radius:3px;overflow:hidden;margin-bottom:16px}
.bar div{height:100%;background:var(--navy);transition:width .3s}
.kind{font-size:.8rem;color:var(--navy);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.q{font-size:1.3rem;margin:6px 0 4px;line-height:1.4;font-family:"Space Grotesk",sans-serif}
.blank{display:inline-block;min-width:64px;border-bottom:3px solid var(--navy);text-align:center;color:var(--navy)}
.hint{color:var(--mut);font-size:.95rem;min-height:1.2em;margin-bottom:8px}
.say{all:unset;cursor:pointer;border:1px solid var(--line);border-radius:8px;padding:4px 10px;font-size:.85rem;margin-bottom:8px}
.opts button{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:12px;width:100%;margin:8px 0;padding:12px 14px;border:1px solid var(--line);border-radius:12px;font-size:1.05rem;background:var(--card)}
.opts button:hover:not(:disabled){border-color:var(--navy)}
.opts b{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;background:var(--soft);color:var(--navy);flex:none;font-size:.9rem}
.opts button.right{border-color:var(--ok);background:var(--okbg)}.opts button.right b{background:var(--ok);color:var(--bg)}
.opts button.wrong{border-color:var(--bad);background:var(--badbg)}.opts button.wrong b{background:var(--bad);color:var(--bg)}
.opts button:disabled{cursor:default}
.fb{margin-top:10px;padding:12px 14px;border-radius:12px;line-height:1.5}
.fb.ok{background:var(--okbg)}.fb.no{background:var(--badbg)}
.btn{all:unset;box-sizing:border-box;cursor:pointer;display:block;width:100%;text-align:center;margin-top:12px;padding:13px;border-radius:12px;font-weight:600;background:var(--navy);color:var(--bg)}
.btn.alt{background:var(--soft);color:var(--fg)}
.big{font-size:2.6rem;text-align:center;color:var(--gold)}
.score{text-align:center;font-size:1.3rem;font-weight:700;font-family:"Space Grotesk",sans-serif}
.msg{text-align:center;color:var(--mut);margin:4px 0 6px}
.review{font-size:.95rem;margin-top:14px}.review li{margin:6px 0}
.hidden{display:none!important}
</style></head>
<body>
<div class="app">
  <a class="back" href="pelit.html">‹ Pelit</a>
  <h1>Kielipeli</h1>
  <p class="sub">Kielten alkeita suomeksi: valitse oikea vaihtoehto A, B, C tai D.</p>

  <section id="start" class="card">
    <p class="lbl">Kieli</p>
    <div class="langs" id="langs"></div>
    <p class="lbl">Pelitapa</p>
    <div class="modes">
      <button class="mode" data-mode="words"><b>📖 Sanat</b><span>Mitä sana tarkoittaa – ja toisin päin</span></button>
      <button class="mode" data-mode="fill"><b>✏️ Täydennä lause</b><span>Valitse lauseesta puuttuva sana</span></button>
      <button class="mode" data-mode="mix"><b>🎲 Sekaisin</b><span>Molempia vuorotellen</span></button>
    </div>
    <div class="best" id="best"></div>
  </section>

  <section id="game" class="card hidden">
    <div class="top"><span id="count"></span><span id="pts"></span></div>
    <div class="bar"><div id="prog"></div></div>
    <div class="kind" id="kind"></div>
    <div class="q" id="question"></div>
    <div class="hint" id="hint"></div>
    <button class="say hidden" id="say">🔊 Kuuntele</button>
    <div class="opts" id="opts"></div>
    <div id="fb" class="fb hidden"></div>
    <button class="btn hidden" id="next">Seuraava →</button>
  </section>

  <section id="end" class="card hidden">
    <div class="big" id="stars"></div>
    <div class="score" id="final"></div>
    <div class="msg" id="msg"></div>
    <button class="btn" id="again">Pelaa uudestaan</button>
    <button class="btn alt" id="home">Vaihda kieltä tai pelitapaa</button>
    <div class="review" id="review"></div>
  </section>
</div>

  while(out.length<ROUND){
    const f=mode==="fill"||(mode==="mix"&&out.length%2===1);
    const q=f?fillQ(fills[fi++%fills.length]):wordQ();
    if(seen.has(q.key))continue;seen.add(q.key);out.push(q);
  }
  return out;
}

/* Ääni */
let voices=[];
function lv(){try{voices=speechSynthesis.getVoices()||[];}catch(e){}}
try{if("speechSynthesis" in window){lv();speechSynthesis.onvoiceschanged=lv;}}catch(e){}
function speak(t){try{const code=L[lang].tts;if(L[lang].say)t=L[lang].say(t);const u=new SpeechSynthesisUtterance(t);u.lang=code;const v=voices.find(x=>x.lang&&x.lang.replace("_","-").toLowerCase().startsWith(code.slice(0,2)));if(v)u.voice=v;u.rate=.85;speechSynthesis.cancel();speechSynthesis.speak(u);}catch(e){}}

/* Kielivalinta */
function drawLangs(){
  const box=$("langs");box.innerHTML="";
  Object.keys(L).forEach(k=>{
    const b=document.createElement("button");
    b.textContent=L[k].flag+" "+L[k].name;b.setAttribute("aria-pressed",k===lang);
    b.onclick=()=>{lang=k;try{localStorage.setItem("kielipeli-kieli",k);}catch(e){}drawLangs();showBest();};
    box.appendChild(b);
  });
}
function showModes(){const has=L[lang].fill.length>0;document.querySelectorAll('.mode[data-mode="fill"],.mode[data-mode="mix"]').forEach(b=>b.classList.toggle("hidden",!has));}
function showBest(){showModes();let b=null;try{b=localStorage.getItem("kielipeli-paras-"+lang);}catch(e){}$("best").textContent=b?`Paras tuloksesi (${L[lang].name.toLowerCase()}): ${b}/${ROUND}`:"";}

let mode,qs,i,score,missed;
function start(m){mode=m;qs=build(m);i=0;score=0;missed=[];
  $("start").classList.add("hidden");$("end").classList.add("hidden");$("game").classList.remove("hidden");show();}
function show(){
  const q=qs[i];
  $("count").textContent=`${L[lang].flag} Kysymys ${i+1}/${ROUND}`;
  $("pts").textContent=`Pisteet: ${score}`;
  $("prog").style.width=(i/ROUND*100)+"%";
  $("kind").textContent=q.kind;$("question").innerHTML=q.q;$("hint").textContent=q.hint;
  $("say").classList.toggle("hidden",!("speechSynthesis" in window));
  $("fb").className="fb hidden";$("next").classList.add("hidden");
  const box=$("opts");box.innerHTML="";
  q.opts.forEach((o,k)=>{const b=document.createElement("button");b.innerHTML=`<b>${LET[k]}</b><span></span>`;b.querySelector("span").textContent=o;b.onclick=()=>answer(b,o);box.appendChild(b);});
}
function answer(btn,o){
  const q=qs[i],ok=o===q.answer;
  [...$("opts").children].forEach(b=>{b.disabled=true;if(b.querySelector("span").textContent===q.answer)b.classList.add("right");});
  if(ok)score++;else{btn.classList.add("wrong");missed.push(q);}
  if(q.kind!=="Sana")$("question").innerHTML=q.q.replace('<span class="blank">?</span>',`<span class="blank">${q.answer}</span>`);
  const fb=$("fb");fb.className="fb "+(ok?"ok":"no");
  fb.innerHTML=(ok?"✅ <b>Oikein!</b> ":"❌ <b>Melkein!</b> Oikea vastaus: <b>"+q.answer+"</b><br>")+q.expl;
  $("pts").textContent=`Pisteet: ${score}`;
  $("next").textContent=i===ROUND-1?"Katso tulos →":"Seuraava →";$("next").classList.remove("hidden");
}
function next(){i++;if(i<ROUND)show();else end();}
function end(){
  $("game").classList.add("hidden");$("end").classList.remove("hidden");
  $("stars").textContent=score>=9?"★★★":score>=6?"★★☆":score>=3?"★☆☆":"☆☆☆";
  $("final").textContent=`${score} / ${ROUND} oikein`;
  $("msg").textContent=score===10?"Täydet pisteet – mahtavaa!":score>=7?"Hienosti meni!":score>=4?"Ei hassumpaa – jatka harjoittelua.":"Ei hätää – harjoitus tekee mestarin.";
  try{const b=+localStorage.getItem("kielipeli-paras-"+lang)||0;if(score>b)localStorage.setItem("kielipeli-paras-"+lang,score);}catch(e){}
  $("review").innerHTML=missed.length?"<b>Kertaa nämä:</b><ul>"+missed.map(q=>`<li>${q.expl}</li>`).join("")+"</ul>":"";
}
document.querySelectorAll(".mode").forEach(b=>b.onclick=()=>start(b.dataset.mode));
$("next").onclick=next;$("say").onclick=()=>speak(qs[i].speak);
$("again").onclick=()=>start(mode);
$("home").onclick=()=>{$("end").classList.add("hidden");$("start").classList.remove("hidden");showBest();};
drawLangs();showBest();
</script>
