<!DOCTYPE html>
<html lang="fi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Presidenttivisa</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Georgia,serif;background:#1b1d24;color:#eee;display:flex;justify-content:center}
.w{width:100%;max-width:460px;padding:14px}
header{display:flex;justify-content:space-between;align-items:center}
a,button{font-family:inherit}.back{color:#aab;text-decoration:none;cursor:pointer;background:none;border:0;font-size:15px}
.lang button{background:none;border:1px solid #555;color:#ccc;border-radius:6px;margin-left:4px;padding:3px 7px;cursor:pointer}
.lang button.on{background:#c9a227;color:#111;border-color:#c9a227}
h1{text-align:center;color:#c9a227;margin:14px 0 4px;font-size:26px}.sub{text-align:center;color:#aaa;margin:0 0 14px}
.card{background:#262934;border-radius:12px;padding:14px;margin-bottom:12px}
.big{display:block;width:100%;padding:13px;margin:7px 0;font-size:17px;border:0;border-radius:9px;background:#3a3f50;color:#fff;cursor:pointer}
.big.gold{background:#c9a227;color:#111;font-weight:bold}
.big.ok{background:#2e8b57}.big.no{background:#b33}
input{width:100%;padding:11px;font-size:20px;text-align:center;letter-spacing:6px;text-transform:uppercase;border-radius:8px;border:0;margin:6px 0}
.pic{display:block;margin:0 auto;width:230px;height:300px;object-fit:cover;border-radius:10px;border:4px solid #c9a227;background:#000}
.bar{display:flex;justify-content:space-between;color:#bbb;margin-bottom:8px}
.q{text-align:center;font-size:19px;margin:10px 0 2px}
.fb{text-align:center;min-height:24px;margin-top:6px;font-size:16px}
table{width:100%;border-collapse:collapse}td{padding:4px 6px;border-bottom:1px solid #333}td:last-child{text-align:right}
.hide{display:none}
</style></head><body><div class="w">
<header><button class="back" onclick="goBack()" id="tBack"></button><div class="lang"><button data-l="fi">FI</button><button data-l="sv">SV</button><button data-l="en">EN</button></div></header>
<h1 id="tTitle"></h1><p class="sub" id="tSub"></p>

<div id="start" class="card">
 <label id="tNick"></label><input id="nick" maxlength="3" autocomplete="off">
 <button class="big gold" onclick="go('who')" id="bWho"></button>
 <button class="big" onclick="go('num')" id="bNum"></button>
 <button class="big" onclick="go('mix')" id="bMix"></button>
</div>

<div id="game" class="card hide">
 <div class="bar"><span id="cnt"></span><span id="pts"></span></div>
 <img id="pic" class="pic" alt="">
 <div class="q" id="qtext"></div>
 <div id="opts"></div>
 <div class="fb" id="fb"></div>
</div>

<div id="end" class="card hide">
 <div class="q" id="endText"></div>
 <button class="big gold" onclick="show('start')" id="bAgain"></button>
</div>

<div class="card"><b id="tTop"></b><table id="top"></table></div>
</div>

const T={
fi:{back:"← Takaisin",title:"Presidenttivisa",sub:"Yhdysvaltain presidentit 1–47",nick:"Nimimerkki (3 kirjainta)",who:"Kuka kuvassa on?",num:"Monesko presidentti?",mix:"Sekoitus",qWho:"Kuka tämä presidentti on?",qNum:"Monesko presidentti tämä on?",ok:"Oikein!",no:"Väärin – oikea vastaus:",q:"Kysymys",p:"pistettä",end:(s,c,n)=>`Valmis! ${c}/${n} oikein ja ${s} pistettä.`,again:"Pelaa uudelleen",top:"Top 20",streak:"putki",and:"ja"},

let L='fi';try{L=localStorage.getItem('sivuKieli')||localStorage.getItem('lang')||'fi'}catch(e){} if(!T[L])L='fi';
const $=id=>document.getElementById(id);
function numLabel(i){const n=i+1;if(n===22||n===24)return `22. ${T[L].and} 24.`;return n+'.';}
function setLang(l){L=l;try{localStorage.setItem('sivuKieli',l)}catch(e){}document.documentElement.lang=l;const t=T[l];
 $('tBack').textContent=t.back;$('tTitle').textContent=t.title;$('tSub').textContent=t.sub;$('tNick').textContent=t.nick;
 $('bWho').textContent=t.who;$('bNum').textContent=t.num;$('bMix').textContent=t.mix;$('bAgain').textContent=t.again;$('tTop').textContent=t.top;
 document.querySelectorAll('.lang button').forEach(b=>b.classList.toggle('on',b.dataset.l===l));drawTop();if(cur)render();}
document.querySelectorAll('.lang button').forEach(b=>b.onclick=()=>setLang(b.dataset.l));
function goBack(){if(history.length>1)history.back();else location.href='index.html';}
function show(id){['start','game','end'].forEach(s=>$(s).classList.toggle('hide',s!==id));}
const shuf=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const N=15;let qs=[],k=0,score=0,right=0,streak=0,cur=null,locked=false,nick='???';
function go(mode){nick=($('nick').value.toUpperCase().replace(/[^A-ZÅÄÖ0-9]/g,'')+'???').slice(0,3);
 qs=shuf([...Array(47).keys()]).slice(0,N).map(i=>({i,type:mode==='mix'?(Math.random()<.5?'who':'num'):mode}));
 k=0;score=0;right=0;streak=0;show('game');next();}
function next(){if(k>=N)return finish();const q=qs[k];locked=false;
 const key=q.type==='who'?(i=>P[i]):numLabel;const correct=key(q.i);const set=new Set([correct]);const opts=[correct];
 let pool=shuf([...Array(47).keys()]);
 if(q.type==='num')pool.sort((a,b)=>Math.abs(a-q.i)-Math.abs(b-q.i)+(Math.random()-.5)*8);
 for(const j of pool){if(opts.length>=4)break;const v=key(j);if(!set.has(v)){set.add(v);opts.push(v)}}
 cur={q,correct,opts:shuf(opts)};render();}
function render(){const {q,opts}=cur,t=T[L];$('cnt').textContent=`${t.q} ${k+1}/${N}`;$('pts').textContent=`${score} ${t.p}`+(streak>1?` · ${streak} ${t.streak}`:'');
 $('pic').src=IMG[q.i+1];$('qtext').textContent=q.type==='who'?t.qWho:t.qNum;
 if(!locked){$('fb').textContent='';$('opts').innerHTML='';opts.forEach(o=>{const b=document.createElement('button');b.className='big';b.textContent=o;b.onclick=()=>answer(b,o);$('opts').appendChild(b)});}}
function answer(b,o){if(locked)return;locked=true;const t=T[L];
 if(o===cur.correct){streak++;right++;score+=10+Math.min(streak-1,5)*2;b.classList.add('ok');$('fb').textContent=t.ok;}
 else{streak=0;b.classList.add('no');document.querySelectorAll('#opts button').forEach(x=>{if(x.textContent===cur.correct)x.classList.add('ok')});
  $('fb').textContent=`${t.no} ${P[cur.q.i]} (${numLabel(cur.q.i)})`;}
 $('pts').textContent=`${score} ${t.p}`;setTimeout(()=>{k++;next()},o===cur.correct?900:2200);}
function getTop(){try{return JSON.parse(localStorage.getItem('presidenttivisaTop')||'[]')}catch(e){return[]}}
function finish(){cur=null;const top=getTop();top.push({n:nick,s:score});top.sort((a,b)=>b.s-a.s);
 try{localStorage.setItem('presidenttivisaTop',JSON.stringify(top.slice(0,20)))}catch(e){}
 $('endText').textContent=T[L].end(score,right,N);show('end');drawTop();}
function drawTop(){$('top').innerHTML=getTop().map((r,i)=>`<tr><td>${i+1}.</td><td>${r.n}</td><td>${r.s}</td></tr>`).join('');}
setLang(L);show('start');
