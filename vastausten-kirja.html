<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Vastausten kirja – Tommi Tampio</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Space+Grotesk:wght@500;700&family=Cormorant+Garamond:wght@600&display=swap">
<style>
/* Sama kapea palsta ja värit kuin muilla sivuilla. Keskellä kirja, jonka kansi aukeaa. */
:root {
  --bg: #F2F5F7; --fg: #14202A; --muted: #566672; --rule: #CBD5DC; --accent: #1F5C8B; --surface: #FFFFFF;
  --paper: #F6EEDD; --ink: #2B2118; --cover1: #5B2A22; --cover2: #3B1813; --gold: #C9A45C;
  --font-display: "Space Grotesk", "Helvetica Neue", Arial, sans-serif;
  --font-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-book: "Cormorant Garamond", Georgia, serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E151B; --fg: #E6ECF0; --muted: #93A3AE; --rule: #26343E; --accent: #78B6E4; --surface: #16212A;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E151B; --fg: #E6ECF0; --muted: #93A3AE; --rule: #26343E; --accent: #78B6E4; --surface: #16212A;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 1rem; line-height: 1.65;
  padding-block: 4rem 3rem;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-tap-highlight-color: transparent;
}
.wrap { max-width: 40rem; margin: 0 auto; display: flex; flex-direction: column; gap: 1.5rem; }
a { color: var(--accent); text-underline-offset: 0.2em; }
a:focus-visible, button:focus-visible, .nayttamo:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 4px; }
.top-nav { font-size: 0.9rem; display: flex; gap: 1rem; }
.top-nav a { text-decoration: none; }
h1 {
  font-family: var(--font-display); font-weight: 700;
  font-size: clamp(2.2rem, 8vw, 3.4rem); line-height: 1.02; letter-spacing: -0.02em;
  margin: 0.75rem 0 0.5rem; text-wrap: balance;
}
.ohje { margin: 0; color: var(--muted); text-align: center; min-height: 3.3em; }

/* Kirja */
.nayttamo { perspective: 1400px; width: min(320px, 86vw); aspect-ratio: 3 / 4; position: relative; cursor: pointer; margin: 0 auto; }
.kirja { position: absolute; inset: 0; transform-style: preserve-3d; transition: transform .25s; }
.nayttamo:active .kirja { transform: scale(.98); }
.sivu {
  position: absolute; inset: 0; border-radius: 4px 10px 10px 4px;
  background: var(--paper); color: var(--ink);
  box-shadow: 0 16px 36px rgba(0,0,0,.28), inset 10px 0 18px -10px rgba(0,0,0,.25);
  display: flex; align-items: center; justify-content: center; text-align: center; padding: 34px 26px;
  background-image: repeating-linear-gradient(0deg, transparent 0 27px, rgba(120,90,50,.06) 27px 28px);
}
.vastaus {
  font-family: var(--font-book); font-weight: 600;
  font-size: clamp(1.6rem, 7vw, 2.2rem); line-height: 1.2; text-wrap: balance;
  opacity: 0; transform: translateY(6px); transition: opacity .9s ease, transform .9s ease;
}
.vastaus.nakyy { opacity: 1; transform: none; }
.kansi {
  position: absolute; inset: 0; border-radius: 4px 10px 10px 4px;
  background: linear-gradient(135deg, var(--cover1), var(--cover2));
  box-shadow: 0 16px 36px rgba(0,0,0,.35), inset 0 0 0 2px rgba(201,164,92,.35), inset 14px 0 20px -8px rgba(0,0,0,.5);
  transform-origin: left center; transition: transform 1.1s cubic-bezier(.6,.05,.3,1);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
  backface-visibility: hidden; z-index: 2; padding: 0 30px;
}
.kansi .kehys { position: absolute; inset: 16px; border: 1.5px solid rgba(201,164,92,.55); border-radius: 4px; }
.kansi .otsikko { font-family: var(--font-book); color: var(--gold); font-size: 2rem; font-weight: 600; text-align: center; line-height: 1.1; text-wrap: balance; }
.kansi .tahti { color: var(--gold); font-size: 1.3rem; opacity: .8; }
.kirja.auki .kansi { transform: rotateY(-165deg); }
.kirja.miettii { animation: huoju 1s ease-in-out; }
@keyframes huoju {
  0%,100% { transform: rotate(0); } 20% { transform: rotate(-2deg); } 40% { transform: rotate(2deg); }
  60% { transform: rotate(-1.5deg); } 80% { transform: rotate(1deg); }
}
@media (prefers-reduced-motion: reduce) {
  .kansi { transition-duration: .3s; } .kirja.miettii { animation: none; }
}

.napit { display: flex; justify-content: center; min-height: 2.75rem; }
button {
  font: inherit; font-weight: 500; cursor: pointer;
  background: var(--accent); color: var(--bg);
  border: 0; border-radius: 999px; padding: 0.6rem 1.3rem; min-height: 2.75rem;
  opacity: 0; pointer-events: none; transition: opacity .5s;
}
button.nakyy { opacity: 1; pointer-events: auto; }
.huomio { font-size: 0.9rem; color: var(--muted); border-top: 1px solid var(--rule); padding-top: 1rem; margin: 0; text-align: center; }
footer { font-size: 0.85rem; color: var(--muted); margin-top: 1.5rem; }
</style>
</head>
<body>
<main class="wrap">
  <header>
    <nav class="top-nav"><a href="index.html">‹ Etusivu</a></nav>
    <h1>Vastausten kirja</h1>
  </header>

  <p class="ohje" id="ohje" aria-live="polite">Ajattele kysymystäsi hetki.<br>Kun olet valmis, kosketa kirjaa.</p>

  <div class="nayttamo" id="nayttamo" role="button" tabindex="0" aria-label="Avaa kirja">
    <div class="kirja" id="kirja">
      <div class="sivu"><div class="vastaus" id="vastaus" data-noi18n aria-live="polite"></div></div>
      <div class="kansi" data-noi18n>
        <div class="kehys"></div>
        <div class="tahti">✦</div>
        <div class="otsikko" id="kansiteksti">Vastausten kirja</div>
        <div class="tahti">✦</div>
      </div>
    </div>
  </div>

  <div class="napit"><button id="uudelleen" type="button">Kysy uudestaan</button></div>

  <p class="huomio">Kirja vastaa, mutta päätös on sinun.</p>

  <footer>© <span id="vuosi">2026</span> Tommi Tampio</footer>
</main>
<script>try{document.getElementById("vuosi").textContent=new Date().getFullYear()}catch(e){}</script>

    ["Pienistä puroista syntyy suuri virta.", "Många bäckar små blir en stor å.", "Little streams make a great river."],

  var tila = "kiinni";
  var nyt = -1;

  function k() {
    var l = document.documentElement.lang;
    return l === "sv" ? 1 : l === "en" ? 2 : 0;
  }
  function piirra() {
    kansiEl.textContent = KANSI[k()];
    if (nyt >= 0) vastausEl.textContent = V[nyt][k()];
  }
  function arvo() {
    var i;
    do { i = Math.floor(Math.random() * V.length); } while (viimeiset.indexOf(i) !== -1);

    return i;

  });
