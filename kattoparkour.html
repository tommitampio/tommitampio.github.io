<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Kattoparkour</title>
<style>
  html,body{margin:0;height:100%;background:#0a0f1c;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;font-family:system-ui,sans-serif}
  canvas{display:block;width:100%;height:100%}
  #panel{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(5,8,18,.82);z-index:5;touch-action:pan-y}
  #panel .card{width:min(94vw,440px);max-height:94vh;overflow:auto;background:#141b2b;border:1px solid #2a3550;border-radius:18px;padding:16px;color:#fff;box-sizing:border-box}
  #panel h2{margin:0 0 2px;font-size:26px;text-align:center}
  #panel .sc{text-align:center;color:#cfe0f2;font-size:18px;font-weight:700;margin-bottom:10px}
  #panel .sec{color:#9db6d0;font-size:13px;margin:8px 0 4px}
  .prz{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
  .prz div{background:#1d2740;border-radius:12px;padding:6px 8px;text-align:center;font-size:12px;animation:pop .5s both}
  .prz img{width:84px;display:block;margin:0 auto 2px}
  @keyframes pop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
  #pName{display:none;gap:8px;margin:10px 0}
  #pName input{flex:1;min-width:0;font-size:17px;padding:10px;border-radius:10px;border:1px solid #3a4a70;background:#0d1322;color:#fff}
  #panel button{font-size:16px;padding:11px 14px;border:0;border-radius:12px;cursor:pointer;color:#fff;background:#26324d}
  #panel button.main{background:#ffd84d;color:#2a2200;font-weight:800;width:100%;margin-top:8px}
  #panel button.alt{width:100%;margin-top:8px}
  #panel button.go{background:#4fd1a5;color:#05241b;font-weight:700}
  .tabs{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.tabs button{flex:1 1 30%}
  .tabs button.on{background:#3a4f86}
  table{width:100%;border-collapse:collapse;font-size:15px;margin-top:8px}
  td{padding:5px 4px;border-bottom:1px solid #222c45}td.r{text-align:right;color:#cfe0f2}td.n{color:#7d8fb0;width:26px}
  tr.me td{background:#2a3a1f;color:#ffd84d;font-weight:700}
  .gar{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
  .gar div{background:#1d2740;border-radius:10px;padding:6px 4px;text-align:center;font-size:11px}
  .gar img{width:100%;display:block}.gar .no img{filter:brightness(0) opacity(.35)}.gar .no{color:#586585}
  .tabs button{font-size:13px!important;padding:11px 3px!important}
  .avg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}
  .avg canvas{width:100%;display:block;border-radius:14px;border:3px solid transparent;background:#1d2740;box-sizing:border-box;cursor:pointer}
  .avg canvas.on{border-color:#ffd84d}
  #bsn{width:100%;box-sizing:border-box;font-size:17px;padding:10px;border-radius:10px;border:1px solid #3a4a70;background:#0d1322;color:#fff}
  #curPt{width:44px;height:44px;border-radius:50%;cursor:pointer;flex:none}
  td.pc{width:34px}td.pc canvas{width:28px;height:28px;display:block;border-radius:50%}
  .rkline{display:flex;align-items:center;justify-content:center;gap:8px;font-size:15px;color:#ffd84d;margin-bottom:8px;font-weight:600}
  .rkline img{height:30px;width:30px}
  td .rk{font-size:11px;color:#7d8fb0;font-weight:400}
  .ladder td{padding:4px}.ladder img{width:28px;height:28px;display:block}.ladder tr.no td{opacity:.35}.ladder tr.cur td{background:#2a3a1f;color:#ffd84d}
  .cities{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
  .city{border-radius:12px;padding:10px;min-height:72px;cursor:pointer;border:3px solid transparent;font-size:12px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.7);box-sizing:border-box}
  .city b{display:block;font-size:16px}.city.sel{border-color:#ffd84d}.city.lock{opacity:.5;cursor:default}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{padding:6px 11px;border-radius:999px;background:#26324d;font-size:13px;cursor:pointer}
  .chip.on{background:#3a4f86;outline:2px solid #ffd84d}
  .sw{width:30px;height:30px;border-radius:50%;border:3px solid #0d1322;cursor:pointer;box-sizing:border-box}
  .sw.on{border-color:#ffd84d}
  .edrow{margin-top:10px}.edrow .lab{font-size:12px;color:#9db6d0;margin-bottom:4px}
  .edprev{display:block;margin:0 auto;width:120px;height:120px;position:sticky;top:0;z-index:3;background:#141b2b;border-radius:50%}
  .empty{color:#7d8fb0;text-align:center;padding:14px;font-size:14px}
</style>
</head>

function feasible(prev,car){

function update(dt){
  t+=dt;

  const cur=cars[hero.cur];
  if(state==="play"){
    if(hero.mode==="charge")hero.charge+=dt;
    if(hero.mode==="idle"||hero.mode==="charge"){
      hero.y=cur.h;cur.t+=dt;
      const dur=alarmDur();
      if(god){cur.t=0;cur.alarm=false;}else if(!cur.alarm&&cur.t>=dur){cur.alarm=true;cur.own=0;}

        cur.own+=dt;

        if(cur.own>=1.0){hero.mode="caught";gameOver("Omistaja tuli! 😠");}
      }
    }
    if(hero.mode==="air"){
      const px=hero.x,py=hero.y;
      hero.vy-=GR*dt;hero.x+=hero.vx*dt;hero.y+=hero.vy*dt;
      if(hero.flip)hero.rot+=dt*2*Math.PI/0.85;
      let landed=-1;
      for(let i=0;i<cars.length;i++){
        const c=cars[i],L=c.x-c.w/2,R=c.x+c.w/2;
        if(hero.vy<0&&py>=c.h&&hero.y<=c.h&&hero.x>=L-3&&hero.x<=R+3){landed=i;break;}
        if(hero.y<c.h-4&&((px<L&&hero.x>=L)||(px>R&&hero.x<=R))){hero.x=px<L?L-2:R+2;hero.vx=-hero.vx*0.2;beep(120,.12,"sawtooth",.1,70);}
      }
      if(landed>=0){
        const c=cars[landed];hero.y=c.h;hero.rot=0;
        const d=Math.abs(hero.x-c.x);
        if(landed>hero.cur){
          const perfect=d<c.w*0.15;

          if(perfect){beep(660,.1,"sine",.12);setTimeout(()=>beep(990,.14,"sine",.12),90);say(hero.x,c.h+60,T("Täysosuma! +2"),"#ffd84d");

          else{beep(520,.12,"sine",.12);say(hero.x,c.h+50,"+1","#fff");}
          if(hero.flip&&!perfect)say(hero.x+10,c.h+80,T("Voltti!"),"#7ad7f0");
          while(cars.length<landed+5)cars.push(newCar(cars[cars.length-1]));

          if(hops%HOPS_PER_LEVEL===0)levelUp();

        beep(110,.1,"sine",.18,60);

      }
    }
  }

  for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy-=380*dt;p.l-=dt*1.2;}
  parts=parts.filter(p=>p.l>0);

  $("pScore").textContent=T("Pisteet")+": "+score+"  ·  "+cn(level);
  $("pRank").innerHTML='<img src="'+insURL(runRank)+'"><span>'+T("Arvo")+': '+T(RANKS[runRank].n)+(bestRank>runRank?' · '+T("ura-arvo")+': '+T(RANKS[bestRank].n):'')+'</span>';
  const pz=$("pPrizes");
  if(runPrizes.length){
    pz.innerHTML='<div class="sec" style="text-align:center">'+T("🎁 Palkinnot tällä kierroksella")+'</div><div class="prz">'+runPrizes.map((k,i)=>'<div style="animation-delay:'+(i*.25)+'s"><img src="'+CARDATA[k].src+'">'+NAMES[k]+'</div>').join("")+'</div>';
  } else pz.innerHTML='<div class="empty">'+T("Läpäise taso (20 hyppyä), niin saat palkinnoksi auton. Aikaisimmat autot ovat halvimpia.")+'</div>';
  savedIdx=-1;
  $("pName").style.display=qualifies()?"flex":"none";
  $("nm").value=lastName;
  setButtons();
  tab=avChosen?"top":"back";renderTab();drawCur();

    saveName();

  }
}
const SKINS=["#ffdbac","#f1c27d","#e0ac69","#c68642","#8d5524","#5c3a21"];
const HAIRC=["#111111","#3a2a1a","#6b4423","#b5651d","#f4d03f","#d2491e","#9e9e9e","#e91e63","#2d6cdf","#4caf50"];

function toEd(a){return {skin:a.skin,hair:a.hair==="cap"?"short":a.hair,hairC:a.hairC,face:a.beard?"beard":a.stache?"stache":"",glasses:a.glasses===true?1:(a.glasses||0),hat:a.hair==="cap"?"cap":(a.hat||""),hatC:a.cap||a.hatC||"#d62828",shirt:a.shirt};}
function fromEd(e){return {skin:e.skin,hair:e.hair,hairC:e.hairC,beard:e.face==="beard"?e.hairC:undefined,stache:e.face==="stache"?e.hairC:undefined,glasses:e.glasses,hat:e.hat||undefined,hatC:e.hatC,shirt:e.shirt};}
function startEdit(){ed=toEd(AVATARS[curAv]);tab="edit";renderTab();}
function renderEditor(){
  const L=$("pList");
  const row=(lab,html)=>'<div class="edrow"><div class="lab">'+T(lab)+'</div>'+html+'</div>';
  const sw=(k,list,cur)=>'<div class="chips">'+list.map(c=>'<div class="sw'+(c===cur?" on":"")+'" data-k="'+k+'" data-v="'+c+'" style="background:'+c+'"></div>').join("")+'</div>';
  const ch=(k,list,cur)=>'<div class="chips">'+list.map(([v,l])=>'<div class="chip'+(v===cur?" on":"")+'" data-k="'+k+'" data-v="'+v+'">'+T(l)+'</div>').join("")+'</div>';
  L.innerHTML='<canvas id="edPrev" class="edprev" width="240" height="240"></canvas>'
    +row("Ihonväri",sw("skin",SKINS,ed.skin))+row("Hiustyyli",ch("hair",HAIRS,ed.hair))+row("Hiusväri",sw("hairC",HAIRC,ed.hairC))
    +row("Kasvokarvat",ch("face",FACE,ed.face))+row("Lasit",ch("glasses",GLASS,ed.glasses))+row("Päähine",ch("hat",HATS,ed.hat))
    +(ed.hat?row("Päähineen väri",sw("hatC",SHIRTS,ed.hatC)):"")+row("Paidan väri",sw("shirt",SHIRTS,ed.shirt))
    +'<button class="alt" id="edRnd">'+T("🎲 Arvo")+'</button><button class="main" id="edSave">'+T("✔ Tallenna hahmo")+'</button><button class="alt" id="edCancel">'+T("Peruuta")+'</button>';
  drawPortrait($("edPrev"),fromEd(ed));
  L.querySelectorAll("[data-k]").forEach(el=>el.onclick=()=>{const k=el.dataset.k;let v=el.dataset.v;if(k==="glasses")v=+v;ed[k]=v;renderEditor();});
  const rnd=l=>l[Math.floor(Math.random()*l.length)];
  $("edRnd").onclick=()=>{ed={skin:rnd(SKINS),hair:rnd(HAIRS)[0],hairC:rnd(HAIRC),face:Math.random()<.25?rnd(FACE.slice(1))[0]:"",glasses:Math.random()<.25?rnd([1,2]):0,hat:Math.random()<.3?rnd(HATS.slice(1))[0]:"",hatC:rnd(SHIRTS),shirt:rnd(SHIRTS)};renderEditor();};
  $("edCancel").onclick=()=>{tab="back";renderTab();};
  $("edSave").onclick=()=>{
    const a=Object.assign({n:"Oma hahmo"},fromEd(ed));AVATARS[CUSTOM]=a;
    try{localStorage.setItem("kattoparkour-custom",JSON.stringify(fromEd(ed)));}catch(e){}
    curAv=CUSTOM;avChosen=true;try{localStorage.setItem("kattoparkour-av",String(curAv));}catch(e){}
    drawCur();tab="back";renderTab();};
}
function setButtons(){
  if(cityUnlocked>1){$("bA").textContent=T("▶ Jatka: ")+cn(startLv);$("bB").style.display=startLv>0?"block":"none";$("bB").textContent=T("Aloita alusta (")+cn(0)+")";}
  else{$("bA").textContent=T("▶ Pelaa uudelleen");$("bB").style.display="none";}
}
function hidePanel(){$("panel").style.display="none";}
function startGame(lv){hidePanel();reset(lv);}
function esc(x){return String(x).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function renderTab(){
  $("tMap").className=tab==="map"?"on":"";$("tRank").className=tab==="rank"?"on":"";$("tTop").className=tab==="top"?"on":"";$("tGar").className=tab==="gar"?"on":"";$("tBack").className=(tab==="back"||tab==="edit")?"on":"";
  const L=$("pList");
  if(tab==="map"){
    let h='<div class="sec">'+T("Kartta: valitse aloituskaupunki. Uusi kaupunki aukeaa, kun edellinen on läpäisty (20 hyppyä).")+'</div><div class="cities">';
    for(let i=0;i<CITIES+FUTURE.length;i++){
      if(i<CITIES){
        const TH=THEMES[i],open=i<cityUnlocked,sel=i===startLv&&open;
        h+='<div class="city '+(open?"":"lock")+(sel?" sel":"")+'" data-c="'+i+'" style="background:linear-gradient('+TH.top+','+TH.bot+')"><b>'+(open?"":"🔒 ")+cn(i)+'</b>'+T('Taso ')+(i+1)+'<br>'+(sel?T("✔ Aloituskaupunki"):open?T("Napauta valitaksesi"):T("Läpäise ")+cn(i-1))+'</div>';
      } else h+='<div class="city lock" style="background:#242c40"><b>🔒 '+T(FUTURE[i-CITIES])+'</b>'+T('Taso ')+(i+1)+'<br>'+T('Tulossa')+'</div>';
    }
    L.innerHTML=h+'</div>';
    L.querySelectorAll(".city[data-c]").forEach(el=>{const i=+el.dataset.c;if(i<cityUnlocked)el.onclick=()=>{startLv=i;saveLv();setButtons();renderTab();};});
    return;
  }
  if(tab==="rank"){
    L.innerHTML='<div class="sec">'+T("Arvot nousevat 5 hypyn välein yhden kierroksen aikana. Ura-arvosi: ")+'<b style="color:#ffd84d">'+T(RANKS[bestRank].n)+'</b></div><table class="ladder">'+RANKS.map((r,i)=>'<tr class="'+(i===bestRank?"cur":i<bestRank?"":"no")+'"><td><img src="'+insURL(i)+'"></td><td>'+r.n+'</td><td class="r">'+r.t+' '+T('hyppyä')+'</td></tr>').join("")+'</table>';
    return;
  }
  if(tab==="edit"){renderEditor();return;}
  if(tab==="back"){
    L.innerHTML='<div class="sec" style="display:flex;justify-content:space-between;align-items:center"><span>'+T("🎭 Backstage: valitse hahmosi ja nimesi")+'</span><span id="bsCar" style="min-width:56px;height:44px;margin:-10px -8px -10px 0;display:flex;align-items:center;justify-content:center;font-size:16px;opacity:.3;user-select:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent">🚗</span></div><input id="bsn" maxlength="16" placeholder="'+T("Nimesi")+'" autocomplete="off"><button class="alt" id="bsEdit">'+T("✏ Muokkaa hahmoa")+'</button><div class="avg">'+AVATARS.map((a,i)=>'<canvas data-i="'+i+'" width="120" height="120" title="'+T(a.n)+'" class="'+(i===curAv?"on":"")+'"></canvas>').join("")+'</div><button class="main" id="bsOk">'+T("✔ Valmis")+'</button>';
    $("bsn").value=lastName;
    $("bsn").oninput=()=>{lastName=$("bsn").value.slice(0,16);$("nm").value=lastName;try{localStorage.setItem("kattoparkour-name",lastName);}catch(e){}};
    L.querySelectorAll(".avg canvas").forEach(cn2=>{const i=+cn2.dataset.i;drawPortrait(cn2,AVATARS[i]);if(i===CUSTOM){const c=cn2.getContext("2d");c.font="30px serif";c.fillText("✏️",6,34);}
      cn2.onclick=()=>{curAv=i;avChosen=true;try{localStorage.setItem("kattoparkour-av",String(curAv));}catch(e){}L.querySelectorAll(".avg canvas").forEach(x=>x.className=(+x.dataset.i===curAv?"on":""));drawCur();};});
    $("bsEdit").onclick=startEdit;
    let gt=0,gl=0;const gi=$("bsCar");
    gi.onclick=()=>{const n=performance.now();gt=(n-gl>4000)?1:gt+1;gl=n;
      if(gt>=20){gt=0;setGod(!god);gi.style.opacity=".9";setTimeout(()=>gi.style.opacity=".28",500);beep(god?880:330,.12,"triangle",.08);}};
    $("bsOk").onclick=()=>{tab="top";renderTab();};
    return;
  }
  if(tab==="top"){
    if(!top20.length){L.innerHTML='<div class="empty">'+T("Lista on vielä tyhjä. Ole ensimmäinen!")+'</div>';return;}
    L.innerHTML="<table>"+top20.map((r,i)=>'<tr class="'+(i===savedIdx?"me":"")+'"><td class="n">'+(i+1)+'.</td><td class="pc"><canvas class="pt" data-i="'+i+'" data-a="'+(r.av||0)+'" width="56" height="56"></canvas></td><td>'+esc(r.name)+'<div class="rk">'+T(RANKS[r.rk||0].n)+'</div></td><td class="r">'+r.score+' p · '+cn(Math.min(r.level,CITIES-1))+'</td></tr>').join("")+"</table>";
    L.querySelectorAll("canvas.pt").forEach(cn2=>{const r=top20[+cn2.dataset.i];drawPortrait(cn2,(r&&r.avd)||AVATARS[+cn2.dataset.a||0]);});
  } else {
    const have=RANK.filter(k=>garage[k]).length;
    L.innerHTML='<div class="sec">'+T("Kerätty ")+have+' / '+RANK.length+T(' (halvin ensin)')+'</div><div class="gar">'+RANK.map((k,i)=>'<div class="'+(garage[k]?"":"no")+'"><img src="'+CARDATA[k].src+'">'+(garage[k]?NAMES[k]+(garage[k]>1?" ×"+garage[k]:""):T("Taso ")+(i+1)+T(" palkinto"))+'</div>').join("")+'</div>';
  }
}
function saveName(){
  if(state!=="over"||$("pName").style.display==="none")return;
  const name=($("nm").value.trim()||"Nimetön").slice(0,16);
  lastName=name;try{localStorage.setItem("kattoparkour-name",name);}catch(e){}
  const rec={name,score,level,av:curAv,avd:curAv===CUSTOM?Object.assign({},AVATARS[CUSTOM]):undefined,rk:runRank,t:Date.now()};
  top20.push(rec);top20.sort((a,b)=>b.score-a.score||a.t-b.t);
  savedIdx=top20.indexOf(rec);
  top20=top20.slice(0,20);if(savedIdx>=20)savedIdx=-1;
  saveTop();$("pName").style.display="none";tab="top";renderTab();
}

  $("tMap").textContent=T("🗺 Kartta");$("tTop").textContent=T("🏆 Top 20");$("tGar").textContent=T("🚗 Talli");$("tBack").textContent=T("🎭 Backstage");$("tRank").textContent=T("🎖 Arvot");

applyStatic();

let pending=0;
for(const k of Object.keys(CARDATA)){const im=new Image();pending++;im.onload=im.onerror=()=>{if(--pending===0)start();};im.src=CARDATA[k].src;CARDATA[k].img=im;}

window.__dbg={setGod,get god(){return god},get runGod(){return runGod},get rank(){return runRank},get bestRank(){return bestRank},reset,get prizes(){return runPrizes},get top(){return top20},get cities(){return cityUnlocked},get score(){return score},get state(){return state},get level(){return level},get hops(){return hops},hero:()=>hero,cars:()=>cars,down,up,
  aim(){const h=hero,c0=cars[h.cur],n=cars[h.cur+1];let bc=0,bd=1e9;for(let c=0.06;c<=1.0001;c+=.01){const lx=landX(c,h.x,c0.h,n.h);if(lx===null)continue;const d=Math.abs(lx-n.x);if(d<bd){bd=d;bc=c;}}return [bc,bd];}};
