sv:{"sub": "Försvara din staty och fäll det rivaliserande bandets.", "play": "Spela", "shop": "Statyverkstad", "coins": "Segermynt", "easy": "Lätt", "normal": "Normal", "hard": "Svår", "help": "🎸 SÅ HÄR ROCKAR DU\n💰 För guldet bildar du ditt band: flöjtister, harpister, spjutmän med mikrofonstativ och jättegitarrister.\n🛡 Försvara: bandet vaktar din staty.\n🤘 Anfall: bandet stormar rivalens staty.\n🏠 Retirera: alla gömmer sig bakom statyn, som själv skjuter pilar.\n🗿 Fäll rivalens staty innan din faller, så är kvällen din.\n🪙 Segrar ger segermynt. Med dem stärker du statyn i verkstaden.\n✖ Ångrat dig? Det röda ✖ på knappen avbryter köpet och du får tillbaka guldet.\n👆 Dra skärmen eller tryck på minikartan för att röra dig på arenan.", "retreat": "🏠 Retirera", "defend": "🛡 Försvara", "attack": "Anfall", "strengthen": "🗿+", "paused": "Paus", "resume": "Fortsätt", "quit": "Avsluta", "win": "Seger!", "lose": "Förlust", "earned": "Du fick {n} segermynt.", "again": "Nytt spel", "menu": "Till menyn", "back": "Tillbaka", "max": "Fullt", "level": "nivå", "units": {"miner": "Gruvarbetare", "sword": "Flöjtist", "archer": "Harpist", "spear": "Spjutman", "giant": "Jätte"}, "up": {"statue": ["Staty", "Statyn tål 25 % mer och växer."], "tower": ["Borgharpist", "+1 harpist vid pålverket som skjuter på fiender som kommer nära."], "gold": ["Startguld", "+150 guld i början."], "carry": ["Gruvsäck", "Gruvarbetaren bär +15 guld per tur."]}, "statTip": "Stärk statyn med guld (högst 3 gånger per spel)", "cont": "▶ Fortsätt sparat spel", "saveQuit": "Avsluta spelet (sparas)", "quitSure": "Avsluta på riktigt?", "bFirst": "FÖRBANDET FÖLL!", "bMulti": "LJUDVÄGG!", "bMultiE": "FIENDENS LJUDVÄGG!", "bGiant": "JÄTTEN PÅ SCENEN!", "bGiantE": "FIENDENS JÄTTE PÅ SCENEN!", "bCrackMine": "DIN STATY SPRICKER!", "bCrackEnemy": "FIENDENS STATY SPRICKER!", "bFall": "RIDÅN GÅR NER!", "music": "Musik", "sounds": "Ljud", "pauseBtn": "Paus", "popFull": "Fullt – högst 50", "campaign": "🗺 Världsturné", "quick": "⚔ Snabbstrid", "fight": "🎸 Spela konserten", "mapBtn": "🗺 Till kartan", "retry": "↻ Försök igen", "cgTitle": "Grattis!", "cgText": "Du har fyllt alla åtta arenor. Varje rivaliserande staty har fallit och din står fortfarande kvar. Du är turnéns legend!", "cgStats": "Spelningar: {a}/8 · Segermynt: {c}", "again2": "↻ Spela turnén igen", "unlocked": "En ny arena öppnades på turnékartan!", "introWel": "Välkommen till", "introLines": ["Åtta arenor. Åtta rivaliserande band. En legendarisk turné.", "Varje band vaktar sin egen jättestaty och spelar för guld.", "Nu är det din tur: bilda ett band, skydda din staty", "och fäll varje rivaliserande staty på turnén.", "Världsturnén börjar i kväll!"], "introGo": "▶ Starta turnén", "cSaves": "💾 Sparade", "csTitle": "Sparade turnéer", "newCamp": "✚ Ny turné från noll", "newCampQ": "Säker? Mynt och förstärkningar nollställs", "camp": "Plats", "rotateMap": "Vrid telefonen för en större karta", "rotate": "Vrid telefonen, så blir gubbarna större", "reset": "↺ Börja om", "resetQ": "Alla segermynt och statyförstärkningar nollställs och den automatiska sparningen raderas. Du börjar från noll. Dina egna sparplatser finns kvar. Är du säker?", "yes": "Ja, börja om", "cancel": "Avbryt", "autosave": "Spelet sparas också automatiskt.", "saveBtn": "💾 Spara spelet", "loadBtn": "📂 Ladda spel", "slotsSave": "Spara spelet", "slotsLoad": "Ladda spel", "slot": "Plats", "empty": "tom", "time": "speltid", "savedOk": "Sparat ✓", "sure": "Säker?", "saveHere": "Spara", "loadHere": "Ladda", "overwrite": "Skriv över?", "cities": ["Hemmaspelning. Det är −15 grader ute, men publiken har med sig egen värme.", "Rött damm, stekande sol och en publik som dansar från första ackordet.", "Neonljus, knivskarpa lasrar och fans som kan varenda ord.", "På andra sidan jordklotet, där till och med vågorna ropar på extranummer.", "Karnevalsrytm, tropisk hetta och 80 000 trummisar på läktarna.", "Regn, flanellskjortor och gitarrerna på högsta volym.", "Staden som aldrig sover, och i kväll blinkar ingen ens.", "Den stora finalen. En jättearena, och bara en staty blir stående."]},
en:{"sub": "Defend your statue and topple the rival band's.", "play": "Play", "shop": "Statue forge", "coins": "Victory coins", "easy": "Easy", "normal": "Normal", "hard": "Hard", "help": "🎸 HOW TO ROCK\n💰 Gold hires your band: flutists, harpists, spearmen with mic stands and giant guitarists.\n🛡 Defend: the band guards your statue.\n🤘 Attack: the band storms the rival statue.\n🏠 Retreat: everyone hides behind the statue, and it fires arrows itself.\n🗿 Topple the rival statue before yours falls, and the night is yours.\n🪙 Wins earn victory coins. Spend them in the forge to make your statue stronger.\n✖ Changed your mind? The red ✖ on a button cancels the purchase and returns the gold.\n👆 Drag the screen or tap the mini map to move around the stadium.", "retreat": "🏠 Retreat", "defend": "🛡 Defend", "attack": "Attack", "strengthen": "🗿+", "paused": "Paused", "resume": "Resume", "quit": "Quit game", "win": "Victory!", "lose": "Defeat", "earned": "You earned {n} victory coins.", "again": "Play again", "menu": "Menu", "back": "Back", "max": "Max", "level": "level", "units": {"miner": "Miner", "sword": "Flutist", "archer": "Harpist", "spear": "Spearman", "giant": "Giant"}, "up": {"statue": ["Statue", "Statue has 25% more health and grows."], "tower": ["Castle harpist", "+1 harpist at the palisade, shooting enemies that come close."], "gold": ["Starting gold", "+150 gold at the start."], "carry": ["Miner's sack", "Miners carry +15 gold per trip."]}, "statTip": "Strengthen the statue with gold (up to 3 times per game)", "cont": "▶ Continue saved game", "saveQuit": "Quit game (saved)", "quitSure": "Really quit?", "bFirst": "OPENING ACT DOWN!", "bMulti": "WALL OF SOUND!", "bMultiE": "RIVAL WALL OF SOUND!", "bGiant": "GIANT ON STAGE!", "bGiantE": "RIVAL GIANT ON STAGE!", "bCrackMine": "YOUR STATUE IS CRACKING!", "bCrackEnemy": "ENEMY STATUE CRACKING!", "bFall": "CURTAIN CALL!", "music": "Music", "sounds": "Sounds", "pauseBtn": "Pause", "popFull": "Full – max 50", "campaign": "🗺 World tour", "quick": "⚔ Quick battle", "fight": "🎸 Play the show", "mapBtn": "🗺 To the map", "retry": "↻ Try again", "cgTitle": "Congratulations!", "cgText": "You packed all eight stadiums. Every rival statue has fallen and yours still stands tall. You are the Legend of the World Tour!", "cgStats": "Shows: {a}/8 · Victory coins: {c}", "again2": "↻ Play the tour again", "unlocked": "A new stadium opened on the tour map!", "introWel": "Welcome to", "introLines": ["Eight stadiums. Eight rival bands. One legendary tour.", "Every band guards its own giant statue and plays for gold.", "Now it's your turn: form a band, protect your statue", "and topple every rival statue on the tour.", "The world tour starts tonight!"], "introGo": "▶ Start the tour", "cSaves": "💾 Saves", "csTitle": "Tour saves", "newCamp": "✚ New tour from scratch", "newCampQ": "Sure? Coins and upgrades reset to zero", "camp": "Place", "rotateMap": "Turn your phone sideways for a bigger map", "rotate": "Turn your phone sideways for bigger fighters", "reset": "↺ Start over", "resetQ": "All victory coins and statue upgrades are reset and the autosave is deleted. You start from scratch. Your own save slots are kept. Are you sure?", "yes": "Yes, start over", "cancel": "Cancel", "autosave": "The game also saves automatically.", "saveBtn": "💾 Save game", "loadBtn": "📂 Load game", "slotsSave": "Save game", "slotsLoad": "Load game", "slot": "Slot", "empty": "empty", "time": "game time", "savedOk": "Saved ✓", "sure": "Sure?", "saveHere": "Save", "loadHere": "Load", "overwrite": "Overwrite?", "cities": ["Hometown show. It's −15 °C outside, but the crowd brought its own heat.", "Red dust, blazing sun and a crowd that dances from the first chord.", "Neon lights, razor-sharp lasers and fans who know every word.", "The other side of the world, where even the waves shout for an encore.", "Carnival rhythm, tropical heat and 80,000 drummers in the stands.", "Rain, flannel shirts and guitars turned all the way up.", "The city that never sleeps, and tonight nobody even blinks.", "The grand finale. One giant stadium, and only one statue left standing."]},
de:{"sub": "Verteidige deine Statue und stürze die der Rivalenband.", "play": "Spielen", "shop": "Statuenschmiede", "coins": "Siegesmünzen", "easy": "Leicht", "normal": "Normal", "hard": "Schwer", "help": "🎸 SO WIRD GEROCKT\n💰 Mit Gold stellst du deine Band zusammen: Flötisten, Harfenisten, Speerträger mit Mikrofonständer und Riesengitarristen.\n🛡 Verteidigen: Die Band bewacht deine Statue.\n🤘 Angriff: Die Band stürmt die Rivalenstatue.\n🏠 Rückzug: Alle verstecken sich hinter der Statue, und sie schießt selbst Pfeile.\n🗿 Stürze die Rivalenstatue, bevor deine fällt, und der Abend gehört dir.\n🪙 Siege bringen Siegesmünzen. Damit verstärkst du deine Statue in der Schmiede.\n✖ Umentschieden? Das rote ✖ am Knopf bricht den Kauf ab, und du bekommst das Gold zurück.\n👆 Wische über den Bildschirm oder tippe auf die Minikarte, um dich im Stadion zu bewegen.", "retreat": "🏠 Rückzug", "defend": "🛡 Verteidigen", "attack": "Angriff", "strengthen": "🗿+", "paused": "Pause", "resume": "Weiter", "quit": "Spiel beenden", "win": "Sieg!", "lose": "Niederlage", "earned": "Du hast {n} Siegesmünzen verdient.", "again": "Nochmal spielen", "menu": "Menü", "back": "Zurück", "max": "Max", "level": "Stufe", "units": {"miner": "Bergmann", "sword": "Flötist", "archer": "Harfenist", "spear": "Speerträger", "giant": "Riese"}, "up": {"statue": ["Statue", "Die Statue hält 25 % mehr aus und wächst."], "tower": ["Burgharfenist", "+1 Harfenist am Palisadenzaun, der nahe Feinde beschießt."], "gold": ["Startgold", "+150 Gold zu Spielbeginn."], "carry": ["Bergmannssack", "Bergleute tragen +15 Gold pro Gang."]}, "statTip": "Verstärke die Statue mit Gold (höchstens 3-mal pro Spiel)", "cont": "▶ Gespeichertes Spiel fortsetzen", "saveQuit": "Spiel beenden (gespeichert)", "quitSure": "Wirklich beenden?", "bFirst": "VORBAND GEFALLEN!", "bMulti": "KLANGWAND!", "bMultiE": "KLANGWAND DER RIVALEN!", "bGiant": "RIESE AUF DER BÜHNE!", "bGiantE": "RIVALENRIESE AUF DER BÜHNE!", "bCrackMine": "DEINE STATUE BEKOMMT RISSE!", "bCrackEnemy": "FEINDLICHE STATUE BEKOMMT RISSE!", "bFall": "DER VORHANG FÄLLT!", "music": "Musik", "sounds": "Geräusche", "pauseBtn": "Pause", "popFull": "Voll – höchstens 50", "campaign": "🗺 Welttournee", "quick": "⚔ Schnelles Spiel", "fight": "🎸 Konzert spielen", "mapBtn": "🗺 Zur Karte", "retry": "↻ Nochmal versuchen", "cgTitle": "Glückwunsch!", "cgText": "Du hast alle acht Stadien gefüllt. Jede Rivalenstatue ist gefallen, und deine steht noch immer. Du bist die Legende der Welttournee!", "cgStats": "Konzerte: {a}/8 · Siegesmünzen: {c}", "again2": "↻ Tournee nochmal spielen", "unlocked": "Ein neues Stadion ist auf der Tourneekarte frei!", "introWel": "Willkommen bei", "introLines": ["Acht Stadien. Acht rivalisierende Bands. Eine legendäre Tournee.", "Jede Band bewacht ihre eigene Riesenstatue und spielt um Gold.", "Jetzt bist du dran: Gründe eine Band, schütze deine Statue", "und stürze jede Rivalenstatue auf der Tournee.", "Heute Abend beginnt die Welttournee!"], "introGo": "▶ Tournee starten", "cSaves": "💾 Spielstände", "csTitle": "Tournee-Spielstände", "newCamp": "✚ Neue Tournee von vorn", "newCampQ": "Sicher? Münzen und Verbesserungen werden auf null gesetzt", "camp": "Ort", "rotateMap": "Dreh das Handy quer für eine größere Karte", "rotate": "Dreh das Handy quer für größere Kämpfer", "reset": "↺ Neu anfangen", "resetQ": "Alle Siegesmünzen und Statuenverbesserungen werden zurückgesetzt und der automatische Spielstand gelöscht. Du fängst von vorn an. Deine eigenen Speicherplätze bleiben erhalten. Bist du sicher?", "yes": "Ja, neu anfangen", "cancel": "Abbrechen", "autosave": "Das Spiel speichert auch automatisch.", "saveBtn": "💾 Spiel speichern", "loadBtn": "📂 Spiel laden", "slotsSave": "Spiel speichern", "slotsLoad": "Spiel laden", "slot": "Platz", "empty": "leer", "time": "Spielzeit", "savedOk": "Gespeichert ✓", "sure": "Sicher?", "saveHere": "Speichern", "loadHere": "Laden", "overwrite": "Überschreiben?", "cities": ["Heimspiel. Draußen sind es −15 °C, aber das Publikum bringt seine eigene Hitze mit.", "Roter Staub, brennende Sonne und ein Publikum, das ab dem ersten Akkord tanzt.", "Neonlichter, messerscharfe Laser und Fans, die jedes Wort kennen.", "Am anderen Ende der Welt, wo sogar die Wellen nach einer Zugabe rufen.", "Karnevalsrhythmus, tropische Hitze und 80.000 Trommler auf den Rängen.", "Regen, Flanellhemden und Gitarren auf voller Lautstärke.", "Die Stadt, die niemals schläft, und heute Nacht blinzelt nicht einmal jemand.", "Das große Finale. Ein Riesenstadion, und nur eine Statue bleibt stehen."]},
es:{"sub": "Defiende tu estatua y derriba la de la banda rival.", "play": "Jugar", "shop": "Taller de estatuas", "coins": "Monedas de victoria", "easy": "Fácil", "normal": "Normal", "hard": "Difícil", "help": "🎸 ASÍ SE ROCKEA\n💰 Con el oro formas tu banda: flautistas, arpistas, lanceros con pie de micro y guitarristas gigantes.\n🛡 Defender: la banda protege tu estatua.\n🤘 Atacar: la banda asalta la estatua rival.\n🏠 Retirada: todos se esconden detrás de la estatua, que dispara flechas por sí misma.\n🗿 Derriba la estatua rival antes de que caiga la tuya y la noche será tuya.\n🪙 Las victorias dan monedas. Con ellas refuerzas tu estatua en el taller.\n✖ ¿Cambiaste de idea? La ✖ roja del botón cancela la compra y recuperas el oro.\n👆 Desliza la pantalla o toca el minimapa para moverte por el estadio.", "retreat": "🏠 Retirada", "defend": "🛡 Defender", "attack": "Atacar", "strengthen": "🗿+", "paused": "Pausa", "resume": "Continuar", "quit": "Salir del juego", "win": "¡Victoria!", "lose": "Derrota", "earned": "Has ganado {n} monedas de victoria.", "again": "Jugar otra vez", "menu": "Menú", "back": "Atrás", "max": "Máx.", "level": "nivel", "units": {"miner": "Minero", "sword": "Flautista", "archer": "Arpista", "spear": "Lancero", "giant": "Gigante"}, "up": {"statue": ["Estatua", "La estatua resiste un 25 % más y crece."], "tower": ["Arpista del castillo", "+1 arpista en la empalizada que dispara a los enemigos cercanos."], "gold": ["Oro inicial", "+150 de oro al empezar."], "carry": ["Saco de minero", "Los mineros llevan +15 de oro por viaje."]}, "statTip": "Refuerza la estatua con oro (hasta 3 veces por partida)", "cont": "▶ Continuar partida guardada", "saveQuit": "Salir del juego (guardado)", "quitSure": "¿Seguro que quieres salir?", "bFirst": "¡CAYÓ EL TELONERO!", "bMulti": "¡MURO DE SONIDO!", "bMultiE": "¡MURO DE SONIDO RIVAL!", "bGiant": "¡GIGANTE EN EL ESCENARIO!", "bGiantE": "¡GIGANTE RIVAL EN EL ESCENARIO!", "bCrackMine": "¡TU ESTATUA SE AGRIETA!", "bCrackEnemy": " const MEL=[72,0,76,0,79,0,76,0,77,0,76,0,74,0,72,0, 69,0,72,0,76,0,72,0,74,0,72,0,71,0,69,0, 65,0,69,0,72,0,77,0,76,0,74,0,72,0,69,0, 71,0,74,0,79,0,77,0,76,0,74,0,71,0,67,0,

const ROOT=[48,45,41,43,48,45,41,43],CHORD=[[0,4,7],[0,3,7],[0,4,7],[0,4,7],[0,4,7],[0,3,7],[0,4,7],[0,4,7]];
function n2f(m){return 440*Math.pow(2,(m-69)/12);}
function mallet(f,t0,vol){tone("sine",f,0,0.45,vol,t0,AU.mus);tone("triangle",f*2,0,0.12,vol*0.25,t0,AU.mus);}
function schedMusic(){
  const c=AU.ctx;if(!c||!save.music||BGM)return;const sd=60/92/4;
  if(AU.next<c.currentTime)AU.next=c.currentTime+0.05;
  while(AU.next<c.currentTime+0.3){
    const st=AU.step%128,bar=Math.floor(st/16),b=st%16,t0=AU.next,D=AU.mus,r=ROOT[bar];
    if(b===0)tone("sine",90,50,0.25,0.22,t0,D);
    if(b===2||b===6||b===10||b===14)noise(0.05,0.035,"highpass",6500,t0,D);
    if(b===0||b===8)tone("triangle",n2f(r-12),0,0.5,0.2,t0,D);
    if(b===6||b===14)tone("triangle",n2f(r-12+7),0,0.25,0.12,t0,D);
    if(b===4||b===12)CHORD[bar].forEach(iv=>tone("sine",n2f(r+12+iv),0,0.3,0.03,t0,D));
    if(b===0)CHORD[bar].forEach(iv=>tone("sine",n2f(r+iv),0,sd*15,0.018,t0,D,1200));
    const m=MEL[st];if(m)mallet(n2f(m),t0,0.07);
    AU.next+=sd;AU.step++;}
}

function hasSaved(){try{return !!localStorage.getItem("sstour2_peli")}catch(e){return false}}

function saveGame(key){key=key||"sstour2_peli";
  if(!G||G.winner>=0||(state!=="play"&&state!=="paused"))return false;
  const d=Object.assign({},G,{units:G.units.filter(u=>!u.dead).map(u=>Object.assign({},u,{mine:u.mine?G.mines.indexOf(u.mine):-1})),
    arrows:[],pieces:[],dust:[],floats:[],camX,nextId,savedAt:Date.now()});
  try{localStorage.setItem(key,JSON.stringify(d));return true}catch(e){return false}
}
function readSlot(key){try{return JSON.parse(localStorage.getItem(key))}catch(e){return null}}
function loadGame(key){
  const d=readSlot(key||"sstour2_peli");
  if(!d||!d.units)return false;
  // vanha, pidempi kenttä: skaalaa sijainnit uuteen kokoon
  const oldW=d.statues&&d.statues[1]?d.statues[1].x+170:W;if(oldW!==W){const f=(W-340)/(oldW-340),fx=x=>170+(x-170)*f;
    for(const u of d.units){u.x=fx(u.x);if(u.tx!=null)u.tx=fx(u.tx);}d.statues[1].x=W-170;d.mines=MINES_X.map(x=>({x,y:GY+12,slots:[]}));for(const u of d.units)if(u.mine>=d.mines.length)u.mine=-1;d.camX=0;}
  for(const m of d.mines)m.slots=[null,null,null,null];
  for(const u of d.units){u.mine=u.mine>=0?d.mines[u.mine]:null;if(u.mine){const i=u.mine.slots.indexOf(null);if(i<0){u.mine=null;if(u.state==="mining")u.state="toMine";}else{u.mine.slots[i]=u.id;u.slot=i;}}}
  nextId=d.nextId||1;camX=d.camX||0;delete d.camX;delete d.nextId;
  delete d.savedAt;G=d;if(!G.diff)G.diff=save.diff;state="play";acc=0;last=performance.now();clampCam();return true;
}

function spawn(team,type){
  const d=UT[type],S=G.statues[team],dir=team?-1:1;
  const u={id:nextId++,team,type,x:S.x+dir*(40+Math.random()*20),y:LANE0+Math.random()*(LANE1-LANE0),hp:d.hp,max:d.hp,

  u.ty=u.y;G.units.push(u);if(team===0&&G.time>0.5){sfx("spawn");u.spin=SPIN;fx();for(let i=0;i<6;i++)G.sparks.push({x:u.x,y:u.y-20,vx:(Math.random()-0.5)*220,vy:-Math.random()*200,t:0,col:SPECTRUM[i%6]});}
  if(team===0&&G.time>0.5&&Math.random()<0.15&&QUIP[type].spawn)say(u.id,pick(QUIP[type].spawn));
  if(type==="giant"&&G.time>0.5){banner(team?t("bGiantE"):t("bGiant"),team?"#ff5a5a":"#c9a0ff");G.shk=Math.max(G.shk||0,0.35);sfx("thud");}

function cancelBuy(team,type){const tm=G.teams[team],q=tm.q[type];if(!q.length)return false;
  q.pop();tm.gold+=UT[type].cost;
  if(team===0){const S=G.statues[0];G.floats.push({x:Math.max(S.x+60,camX+80),y:GY-110,txt:"↩ +"+UT[type].cost,col:"#ffe14d",t:0});}return true;}
function popOf(team){let p=0;for(const u of G.units)if(u.team===team&&!u.dead)p+=UT[u.type].pop;
  for(const k of ORDER)p+=G.teams[team].q[k].length*UT[k].pop;return p;}
function countOf(team,type){let n=G.teams[team].q[type].length;for(const u of G.units)if(u.team===team&&!u.dead&&u.type===type)n++;return n;}
function buy(team,type){
  const tm=G.teams[team],d=UT[type];
  if(team===0&&G.god){if(popOf(0)+d.pop>POPMAX)return false;tm.q[type].push(0.02);return true;}
  if(team===0&&G.ab&&G.ab.mgr>0){if(tm.gold<d.cost||popOf(0)+d.pop>POPMAX)return false;tm.gold-=d.cost;tm.q[type].push(0.02);return true;}
  if(tm.gold<d.cost||popOf(team)+d.pop>POPMAX)return false;
  tm.gold-=d.cost;tm.q[type].push(Math.min(1.2,d.train*0.25));return true;
}
function armyPow(team,minX,maxX){let p=0;for(const u of G.units)if(u.team===team&&!u.dead&&u.type!=="miner"&&(minX==null||(u.x>=minX&&u.x<=maxX)))p+=UT[u.type].cost;return p;}

/* ================= LOGIIKKA ================= */
function step(dt){
  if(!G||G.fake)return;
  G.time+=dt;
  // kulta tulee itsestään (ei kaivajia)
  G.teams[0].gold+=dt*(32+6*save.up.gold+4*save.up.carry)*(G.ab&&G.ab.mgr>0?2:1);G.teams[1].gold+=dt*32*G.teams[1].income;
  // koulutusjonot
  G.teams.forEach((tm,i)=>{for(const k of ORDER){const q=tm.q[k];if(q.length){q[0]-=dt;if(q[0]<=0){q.shift();spawn(i,k);}}}});
  // tekoäly
  G.aiT-=dt;if(G.aiT<=0&&G.winner<0){G.aiT=cfg().think;aiThink();}
  stepAbil(dt);
  for(const u of G.units){if(u.dead){u.deadT+=dt;if(u.fvx!=null&&!u.landed){u.fx+=u.fvx*dt;u.fy+=u.fvy*dt;u.fvy+=900*dt;u.rot+=u.frot*dt;if(u.fy>=0&&u.fvy>0){u.landed=1;gibs(Object.assign({},u,{x:u.x+u.fx}));u.deadT=3.3;}}continue;}
    if(u.type==="miner"&&u.carrying&&u.team===0&&Math.random()<dt*0.9){fx();G.notes.push({x:u.x,y:u.y-48,t:0,c:Math.random()<0.5?"♪":"♫"});}
    if(u.type==="giant"&&u.moving){const st=Math.floor(u.phase/Math.PI);if(st!==u.lastStep){u.lastStep=st;G.dust.push({x:u.x+u.face*6,y:u.y,vx:-u.face*20,vy:-10,t:0,life:0.6,r:4});}}u.atk=Math.max(0,u.atk-dt);if(u.spin>0)u.spin=Math.max(0,u.spin-dt);
    if(G.winner>=0&&u.team===G.winner&&!(u.spin>0)&&Math.random()<dt*0.7)u.spin=SPIN;u.moving=false;u.hidden=false;
    if(G.teams[u.team].mode==="retreat")goHide(u,dt);
    else if(u.type==="miner")updMiner(u,dt);else updFighter(u,dt);
    u.y+=(u.ty-u.y)*Math.min(1,dt*2);if(u.moving)u.phase+=dt*UT[u.type].spd/6;}
  G.units=G.units.filter(u=>!u.dead||u.deadT<3.2);
  stepFx(dt);stepComic(dt);
  // linnan jousimiehet paaluaidan luona
  for(const S of G.statues){S.shake=Math.max(0,S.shake-dt);if(!S.alive){S.guarded=false;continue;}
    const ret=G.teams[S.team].mode==="retreat";let ar=0,ot=0;
    if(ret)for(const u of G.units)if(u.team===S.team&&u.hidden){if(u.type==="archer")ar++;else ot++;}
    S.guarded=ret&&ar+ot>0;
    const n=guardCount(S,ar);S.nGuards=n;const gs=guards(S);
    for(let i=0;i<n;i++){const g=gs[i];g.atk=Math.max(0,g.atk-dt);g.cd-=dt;if(g.cd>0)continue;
      const e=nearestEnemy(S.team,S.x,ret?480:420);
      if(!e){g.cd=0.3;continue;}
      g.cd=(ret?0.9:1.5)*(0.85+Math.random()*0.3);g.atk=0.35;g.face=Math.sign(e.x-g.x)||1;
      shoot(S.team,g.x+g.face*10,g.y-27,e,ret?15+ot*4.5/n:12);}
  }
  for(const S of G.statues)if(G.teams[S.team].mode!=="retreat")S.guarded=false;
  // nuolet
  for(const a of G.arrows){a.t+=dt;a.x+=a.vx*dt;a.y+=a.vy*dt;a.vy+=700*dt;
    if(a.t>=a.T){a.done=true;const tg=a.tg;if(tg&&!tg.dead&&!tg.hidden&&(tg.hp>0)&&Math.abs((tg.x)-a.x)<35)hurt(tg,a.dmg,a.team,"arrow");}}
  G.arrows=G.arrows.filter(a=>!a.done);
  // romahdus
  for(const p of G.pieces){p.vy+=900*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.a+=p.va*dt;
    if(p.y>p.gy){p.y=p.gy;p.vy*=-0.25;p.vx*=0.6;p.va*=0.5;if(Math.abs(p.vy)<30)p.vy=0;}}
  for(const d of G.dust){d.t+=dt;d.x+=d.vx*dt;d.y+=d.vy*dt;d.vy-=10*dt;}
  G.dust=G.dust.filter(d=>d.t<d.life);
  for(const f of G.floats){f.t+=dt;f.y-=25*dt;}
  G.floats=G.floats.filter(f=>f.t<1.2);
  if(G.overT>=0){G.overT+=dt;if(G.overT>3.2&&state==="play")endGame();}
}
function nearestEnemy(team,x,maxD){let best=null,bd=maxD;const fog=team===1&&G.ab&&G.ab.smoke>0;
  for(const u of G.units){if(u.team===team||u.dead||u.hidden||(fog&&u.team===0))continue;const d=Math.abs(u.x-x);if(d<bd){bd=d;best=u;}}return best;}
function moveTo(u,tx,dt){const A=G.ab;if(A&&A.wall&&u.team===1&&u.x>=A.wall.x+14)tx=Math.max(tx,A.wall.x+16);
  const d=tx-u.x;if(Math.abs(d)<3)return true;const s=UT[u.type].spd*dt*(A&&A.king>0&&u.team===0&&u.type!=="miner"?1.4:1);u.x+=Math.sign(d)*Math.min(Math.abs(d),s);u.face=Math.sign(d);u.moving=true;return false;}
const MSLOT=[{dx:-28,dy:-7},{dx:28,dy:-7},{dx:-22,dy:9},{dx:22,dy:9}];
function freeMine(u){if(u.mine){const i=u.mine.slots.indexOf(u.id);if(i>=0)u.mine.slots[i]=null;u.mine=null;}}
function guards(S){
  if(!S.guards){S.guards=[];const dir=S.team?-1:1;
    for(let i=0;i<8;i++)S.guards.push({x:S.x-dir*(82+(i%2)*16-(i>>1)*3),y:LANE0+6+((i*13)%62),cd:Math.random(),atk:0,face:dir});}
  return S.guards;}
function guardCount(S,hiddenArchers){return Math.min(8,2+(S.tower||0)+(hiddenArchers||0));}
function goHide(u,dt){
  const S=G.statues[u.team],dir=u.team?-1:1,tm=G.teams[u.team];
  if(u.mine){freeMine(u);u.state="toMine";}
  if(u.state==="mining")u.state="toMine";
  const hx=Math.max(20,Math.min(W-20,S.x-dir*(30+(u.id%7)*7)));
  if(u.carrying&&Math.abs(u.x-S.x)<40){const g=Math.round(u.carrying*tm.income);tm.gold+=g;u.carrying=0;u.state="toMine";if(u.team===0)G.floats.push({x:u.x,y:u.y-50,txt:"+"+g,col:"#ffe14d",t:0});}
  u.ty=LANE0+10+((u.id*23)%40);
  if(moveTo(u,hx,dt)){u.hidden=true;u.face=dir;}
}
function updMiner(u,dt){
  const S=G.statues[u.team],tm=G.teams[u.team],dir=u.team?-1:1;
  if(u.state==="toMine"){
    if(!u.mine){let best=null,bd=1e9;for(const m of G.mines){if(m.slots.indexOf(null)<0)continue;const d=Math.abs(m.x-S.x);if(d<bd){bd=d;best=m;}}
      if(!best){u.ty=LANE0+((u.id*37)%60);if(moveTo(u,S.x+dir*(75+(u.id%8)*16),dt))u.face=dir;return;}
      const i=best.slots.indexOf(null);best.slots[i]=u.id;u.mine=best;u.slot=i;u.ty=best.y+MSLOT[i].dy;}
    if(moveTo(u,u.mine.x+MSLOT[u.slot].dx,dt)){u.state="mining";u.timer=MINE_TIME;u.face=MSLOT[u.slot].dx>0?-1:1;}
  }else if(u.state==="mining"){u.timer-=dt;u.phase+=dt*7;u.atk=0.35*(0.5+0.5*Math.sin(u.phase));
    if(u.timer<=0){u.carrying=tm.carry;freeMine(u);u.state="toBase";u.ty=LANE0+Math.random()*(LANE1-LANE0);}
  }else if(u.state==="toBase"){
    if(moveTo(u,S.x+dir*SHOPX,dt)){const g=Math.round(u.carrying*tm.income);tm.gold+=g;u.carrying=0;u.state="toMine";
      if(u.team===0)sfx("coin");if(u.team===0)G.floats.push({x:u.x,y:u.y-50,txt:"+"+g,col:"#ffe14d",t:0});}
  }
}
function updFighter(u,dt){
  const d=UT[u.type],tm=G.teams[u.team],S=G.statues[u.team],E=G.statues[1-u.team],dir=u.team?-1:1;
  const aggro=d.ranged?d.range+30:230;
  let tg=nearestEnemy(u.team,u.x,aggro);
  if(tm.mode==="defend"&&tg&&Math.abs(tg.x-S.x)>700)tg=null;
  u.engaged=!!tg;
  if(tg){const dist=Math.abs(tg.x-u.x);
    if(dist>d.range)moveTo(u,tg.x-Math.sign(tg.x-u.x)*(d.range*0.8-(u.id%4)*3),dt);else{u.face=Math.sign(tg.x-u.x)||dir;attack(u,tg,dt);}return;}
  u.cd=Math.max(0,u.cd-dt);
  if(tm.mode==="attack"&&E.alive){const dist=Math.abs(E.x-u.x)-40;
    if(dist>d.range)moveTo(u,E.x-dir*(40+d.range*0.7-(u.id%4)*4),dt);else{u.face=dir;attack(u,E,dt);}}
  else{const post=S.x+dir*((d.ranged?120:190)+(u.id%4)*14+(u.type==="giant"?30:0));if(moveTo(u,post,dt))u.face=dir;}
}
function attack(u,tg,dt){
  const d=UT[u.type];u.cd-=dt;if(u.cd>0)return;u.cd=d.rate*(u.team===0&&G.ab&&G.ab.king>0?0.65:1);u.atk=0.35;if(!d.ranged)sfx("hit",u.x);
  if(d.ranged){shoot(u.team,u.x+u.face*10,u.y-27,tg,d.dmg);return;}
  if(u.type==="sword"){u.hits=(u.hits||0)+1;if(u.hits%4===0){u.spin=SPIN;hurt(tg,d.dmg*0.5,u.team);pop(u.x,u.y-40,"WHOOSH!");}}
  if(d.splash&&tg.type){for(let i=0;i<6;i++)G.dust.push({x:tg.x+(Math.random()-0.5)*40,y:tg.y-Math.random()*6,vx:(Math.random()-0.5)*60,vy:-20-Math.random()*20,t:0,life:0.6,r:3+Math.random()*3});for(const e of G.units)if(e.team!==u.team&&!e.dead&&!e.hidden&&Math.abs(e.x-tg.x)<d.splash)hurt(e,d.dmg,u.team,"giant");}
  else hurt(tg,d.dmg,u.team,u.type);
}
function shoot(team,x,y,tg,dmg){
  sfx("arrow",x);
  const tx=tg.x,ty=tg.type?tg.y-25:GY-90;const dist=Math.abs(tx-x);const T=Math.max(0.3,dist/420);
  G.arrows.push({team,x,y,tg,dmg,t:0,T,vx:(tx-x)/T,vy:(ty-y-0.5*700*T*T)/T});
}
function hurt(tg,dmg,from,kind){
  if(kind)comicHit(tg,kind);
  if(!tg.type){ // patsas
    if(!tg.alive)return;const f0=tg.hp/tg.max;tg.hp-=tg.guarded?dmg*0.6:dmg;const f1=tg.hp/tg.max;
    for(const th of[0.5,0.25])if(f0>th&&f1<=th&&tg.hp>0){banner(tg.team===0?t("bCrackMine"):t("bCrackEnemy"),tg.team===0?"#ff5a5a":"#f5c400");G.shk=Math.max(G.shk||0,0.5);
      for(let i=0;i<3;i++)G.pieces.push({x:tg.x+(Math.random()-0.5)*30,y:GY-150*tg.size,len:8+Math.random()*8,w:6,col:"#8e8e8e",a:Math.random()*3,vx:(Math.random()-0.5)*120,vy:-60,va:(Math.random()-0.5)*8,gy:GY-4+Math.random()*12});}tg.shake=0.15;sfx("thud",tg.x);
    if(Math.random()<0.4)G.dust.push({x:tg.x+(Math.random()-0.5)*60,y:GY-Math.random()*150*tg.size,vx:(Math.random()-0.5)*30,vy:-10,t:0,life:0.8,r:4});
    if(tg.hp<=0){tg.hp=0;collapse(tg);}return;}
  const d=UT[tg.type];tg.hp-=dmg*(1-(d.armor||0));
  if(tg.hp<=0)killUnit(tg,dmg);
}

/* ================= EFEKTIT ================= */
function fx(){if(!G.gibs){G.gibs=[];G.ghosts=[];G.sparks=[];G.notes=[];G.banners=[];}}
function banner(txt,col){fx();if(G.banners.length>2)return;G.banners.push({txt,col,t:0});}
function killUnit(u,dmg){
  fx();u.dead=true;freeMine(u);
  if(u.type==="miner"){G.teams[u.team].gold+=125;if(u.team===0){const S=G.statues[0];G.floats.push({x:S.x+70,y:GY-130,txt:"+125 💰",col:"#ffe14d",t:0});}}const dir=u.team===0?-1:1,big=dmg>=50;

// Kuinka monta sekuntia tekoäly pysyy alussa kotona (helppo pisin, vaikea lyhin)
function aiCalm(D){if(G.level===0)return 1e9;if(G.level!=null)return Math.max(40,70-G.level*4);return {easy:50,normal:35,hard:22}[G.diff]||35;}
function aiThink(){
  const D=cfg(),tm=G.teams[1];
  // Rauhallinen alku: tekoäly ei hyökkää eikä tee jättiläistä ennen kuin pelaaja on ehtinyt koota bändin
  const calm=aiCalm(D),early=G.time<calm;
  const fighters=G.units.filter(u=>u.team===1&&!u.dead&&u.type!=="miner"&&u.type!=="giant").length;
  const maxGiants=D.units.filter(x=>x==="giant").length;
  const giantOk=()=>!early&&fighters>=4&&countOf(1,"giant")<maxGiants;
  {if(!tm.wish)tm.wish=D.units[Math.floor(Math.random()*D.units.length)];
    if(tm.wish==="giant"&&!giantOk()){const o=D.units.filter(x=>x!=="giant");tm.wish=o[Math.floor(Math.random()*o.length)];}
    if(buy(1,tm.wish))tm.wish=null;}
  const my=armyPow(1),pl=armyPow(0);

  if(threat>=600&&my<pl*0.35)tm.mode="retreat";

function draw(){
  calcView();clampCam();ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle="#5e0606";ctx.fillRect(0,0,cw,ch);
  const shx=(G&&G.shk>0)?(Math.random()-0.5)*14*G.shk:0,shy=(G&&G.shk>0)?(Math.random()-0.5)*10*G.shk:0;
  ctx.setTransform(scale*dpr,0,0,scale*dpr,(-camX*scale+shx)*dpr,(offY+shy)*dpr);
  drawBg();
  if(!G||G.fake)return;
  for(const m of G.mines)drawMine(m);
  for(const S of G.statues){drawShop(S);drawPalisade(S);if(S.alive){const gs=guards(S);for(let i=0;i<(S.nGuards||2);i++)drawGuard(S,gs[i]);}}
  drawCrowd();
  for(const S of G.statues)drawStatue(S);
  const list=[...G.units].sort((a,b)=>(a.dead?-1:0)-(b.dead?-1:0)||a.y-b.y);
  for(const u of list)drawUnit(u);
  ctx.strokeStyle="#3a2a1a";ctx.lineWidth=1.5;
  for(const a of G.arrows){const l=Math.hypot(a.vx,a.vy);ln(a.x,a.y,a.x-a.vx/l*12,a.y-a.vy/l*12);}
  ctx.lineCap="round";for(const p of G.pieces){ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.a);ctx.strokeStyle=p.col;ctx.lineWidth=p.w;ln(-p.len/2,0,p.len/2+0.01,0);ctx.restore();}
  drawAbil();drawFx();drawLeaves();drawConfetti();
  for(const d of G.dust){ctx.fillStyle=`rgba(150,140,130,${0.6*(1-d.t/d.life)})`;ctx.beginPath();ctx.arc(d.x,d.y,d.r*(1+d.t),0,7);ctx.fill();}
  drawComic();
  ctx.font="bold 15px system-ui";ctx.textAlign="center";
  for(const f of G.floats){ctx.fillStyle=f.col;ctx.globalAlpha=1-f.t/1.2;ctx.fillText(f.txt,f.x,f.y);ctx.globalAlpha=1;}
  // patsaiden kuntopalkit (ruudun yläosassa)
  ctx.setTransform(dpr,0,0,dpr,0,0);
  if(G.flash>0){ctx.fillStyle="rgba(255,255,255,"+(G.flash*0.7)+")";ctx.fillRect(0,0,cw,ch);}
  drawBanner();
  if(G.god){ctx.font="900 12px system-ui";ctx.textAlign="center";ctx.fillStyle="#7df9ff";ctx.fillText("⚡ GOD MODE ⚡",cw/2,16);}
  G.statues.forEach((S,i)=>{const bw=Math.min(180,cw*0.3),x=i?cw-bw-10:10,y=10;
    ctx.fillStyle="#000a";ctx.fillRect(x-2,y-2,bw+4,14);ctx.fillStyle=i?"#e33":"#3d3";ctx.fillRect(x,y,bw*S.hp/S.max,10);
    ctx.fillStyle="#fff";ctx.font="bold 11px system-ui";ctx.textAlign=i?"right":"left";ctx.fillText("🗿 "+Math.ceil(S.hp),i?x+bw:x,y+26);});
  if(ch>cw*1.2&&offY>140){ctx.textAlign="center";ctx.fillStyle="#ffffffaa";ctx.font="bold 16px system-ui";ctx.fillText("📱 ↻",cw/2,offY*0.5);t("rotate").split(", ").forEach((l,i)=>ctx.fillText(l,cw/2,offY*0.5+24+i*22));}
  ctx.textAlign="center";ctx.font="bold 13px system-ui";
  const tm=G.teams[1];if(state==="play"&&G.winner<0){ctx.fillStyle="#fffc";ctx.fillText((tm.mode==="attack"?"🤘":tm.mode==="retreat"?"🏠":"🛡"),cw-14,48);}
}
function drawMini(){

}

        if(id%3!==1){c.strokeStyle=col;c.lineWidth=Math.max(1.2,sz*0.45);c.lineCap="round";const wv=Math.sin(T*4+id)*sz*0.6;
          c.beginPath();c.moveTo(x+sz*0.8,hy+sz);c.lineTo(x+sz*1.6+wv,hy-sz*2.6);c.stroke();
          if(id%4===0){c.beginPath();c.moveTo(x-sz*0.8,hy+sz);c.lineTo(x-sz*1.6-wv,hy-sz*2.6);c.stroke();}
          if(id%5===0){c.fillStyle=id%2?"#ffd060":"#cdeaff";c.globalAlpha=0.7+0.3*Math.sin(T*9+id);c.beginPath();c.arc(x+sz*1.6+wv,hy-sz*3.1,sz*0.45,0,7);c.fill();c.globalAlpha=1;}}}}
  }
  an=requestAnimationFrame(frame);
  function go(){cancelAnimationFrame(an);$("intro").style.transition="opacity .5s";$("intro").style.opacity=0;setTimeout(()=>{$("intro").remove();if(save.camp<LEVELS.length)newGame(save.camp);else showMenu();},500);}
  $("intro").addEventListener("click",go,{once:true});
})();
resize();applyLang();requestAnimationFrame(loop);
</script>
