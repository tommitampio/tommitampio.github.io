<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap">
<style>
:root{--bg:#F2F5F7;--card:#fff;--fg:#14202A;--mut:#566672;--line:#CBD5DC;--navy:#1F5C8B;--red:#b8322a;--ok:#2e7d4f;--bad:#c0392b;--dem:#2b5fb4;--rep:#c0392b;--oth:#7a6a3a}
@media (prefers-color-scheme:dark){:root{--bg:#0E151B;--card:#141e26;--fg:#E6ECF0;--mut:#93A3AE;--line:#26343E;--navy:#78B6E4;--red:#ef6f5e;--ok:#5cc489;--bad:#ef6f5e}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 "Inter",system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh;display:flex;justify-content:center;padding:18px 14px 40px}
.app{width:100%;max-width:520px}
h1{margin:0 0 2px;font-size:2rem;letter-spacing:-.02em;font-family:"Space Grotesk",sans-serif}.back{display:inline-block;margin-bottom:14px;color:var(--navy);text-decoration:none;font-size:.9rem}
.sub{color:var(--mut);margin:0 0 18px}
.stars{color:var(--red);letter-spacing:4px;font-size:.8rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}
.modes{display:grid;gap:10px}
.mode{all:unset;cursor:pointer;display:block;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.mode b{display:block;font-size:1.05rem}.mode span{color:var(--mut);font-size:.9rem}
.mode:active{transform:scale(.99)}
.best{color:var(--mut);font-size:.85rem;margin-top:14px;text-align:center}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;color:var(--mut);font-size:.9rem}
.top button{all:unset;cursor:pointer;color:var(--navy);font-weight:600}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:16px}.bar i{display:block;height:100%;background:var(--navy);transition:width .3s}
.num{font-family:"Space Grotesk",sans-serif;font-size:3.4rem;font-weight:700;color:var(--navy);line-height:1;text-align:center;margin:6px 0}
.q{text-align:center;font-size:1.15rem;font-weight:600;margin:6px 0 16px}
.opts{display:grid;gap:10px}
.opt{all:unset;cursor:pointer;text-align:center;padding:14px;border:1.5px solid var(--line);border-radius:12px;font-weight:600;background:var(--card);transition:background .15s,border-color .15s}
.opt.ok{background:color-mix(in srgb,var(--ok) 18%,var(--card));border-color:var(--ok)}
.opt.bad{background:color-mix(in srgb,var(--bad) 16%,var(--card));border-color:var(--bad)}
.opt[disabled]{cursor:default}
.info{margin-top:16px;padding:14px;border-radius:12px;background:var(--bg);display:none}
.info.show{display:block}
.info h3{margin:0 0 2px;font-size:1.1rem}
.meta{color:var(--mut);font-size:.9rem;margin-bottom:6px}
.party{display:inline-block;padding:1px 8px;border-radius:99px;color:#fff;font-size:.78rem;font-weight:600;margin-left:4px}
.info a{color:var(--navy);font-size:.9rem}
.next{all:unset;box-sizing:border-box;width:100%;cursor:pointer;display:block;text-align:center;margin-top:14px;padding:14px;border-radius:12px;background:var(--navy);color:#fff;font-weight:700}
@media (prefers-color-scheme:dark){.next{color:#12141a}}
.verdict{font-weight:700;margin-bottom:6px}.verdict.ok{color:var(--ok)}.verdict.bad{color:var(--bad)}
.end{text-align:center}.end .big{font-size:3rem;font-weight:800;color:var(--navy)}
.miss{text-align:left;margin-top:14px;font-size:.9rem;color:var(--mut)}.miss li{margin:2px 0}
.lb{width:100%;border-collapse:collapse;margin-top:10px;font-size:.95rem}.lb td{padding:7px 4px;border-bottom:1px solid var(--line)}.lb td:first-child{color:var(--mut);width:2em}.lb td:nth-child(3){text-align:right;font-weight:700;font-variant-numeric:tabular-nums}.lb td:last-child{text-align:right;color:var(--mut);font-size:.8rem;width:5.5em}.lb tr.me td{background:color-mix(in srgb,var(--navy) 12%,transparent)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.tab{all:unset;cursor:pointer;padding:6px 10px;border-radius:99px;border:1px solid var(--line);font-size:.85rem}.tab.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.entry{margin-top:14px;padding:14px;border-radius:12px;background:var(--bg);text-align:left}.entry input{width:100%;font:inherit;font-size:1.1rem;padding:12px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--fg);margin:8px 0 0}
.empty{color:var(--mut);text-align:center;padding:18px 0}
</style></head><body><div class="app" id="app"></div>

const rnd=n=>Math.floor(Math.random()*n);

function getLB(){try{return JSON.parse(localStorage.getItem("pv_lb")||"{}")}catch(e){return{}}}
function saveLB(lb){try{localStorage.setItem("pv_lb",JSON.stringify(lb))}catch(e){}}
function qualifies(m,score){if(score<=0)return false;const l=getLB()[m]||[];return l.length<10||score>l[l.length-1].s}
function addLB(m,name,score,tot){const lb=getLB();const l=lb[m]||[];const d=new Date();const e={n:name,s:score,t:tot,d:d.getDate()+"."+(d.getMonth()+1)+"."+d.getFullYear(),id:Date.now()};l.push(e);l.sort((a,b)=>b.s-a.s||a.id-b.id);lb[m]=l.slice(0,10);saveLB(lb);return e.id}

function home(){
 const b=getBest();
 app.innerHTML=`<a class="back" href="pelit.html">‹ Pelit</a><h1>Presidenttivisa</h1><div class="stars">★ ★ ★ ★ ★</div><p class="sub">Yhdysvaltain presidentit 1789–2025</p>

function start(m){st={m,list:MODES[m].q(),i:0,score:0,miss:[]};ask()}

function ask(){
 const n=st.list[st.i],p=byNum(n),type=MODES[st.m].type;
 let q,opts,correct;
 const near=()=>{const pool=P.filter(x=>x[1]!==p[1]&&Math.abs(x[0]-n)<=8);const names=[...new Set(shuffle(pool).map(x=>x[1]))];return names.slice(0,3)};
 if(type==="who"){q=`<div class="num">${n}.</div><div class="q">Kuka oli ${n}. presidentti?</div>`;correct=p[1];opts=shuffle([correct,...near()])}
 else if(type==="num"){
  const lbl=p[1]+(p[1]==="Grover Cleveland"||p[1]==="Donald Trump"?(p[0]===22||p[0]===45?" (1. kausi)":" (2. kausi)"):"");
  q=`<div class="q" style="font-size:1.5rem;margin-top:10px">${lbl}</div><div class="q" style="font-weight:400;color:var(--mut)">Monesko presidentti?</div>`;
  correct=n+".";const other=P.filter(x=>x[1]===p[1]&&x[0]!==n).map(x=>x[0]);
  const c=new Set();while(c.size<3){const d=n+(rnd(13)-6);if(d>=1&&d<=47&&d!==n&&!other.includes(d))c.add(d)}
  opts=shuffle([correct,...[...c].map(x=>x+".")]);
 } else {const y=yearIn(p);st.year=y;q=`<div class="num">${y}</div><div class="q">Kuka oli presidenttinä vuonna ${y}?</div>`;correct=p[1];opts=shuffle([correct,...near()])}
 st.correct=correct;
 const tot=st.list.length;
 app.innerHTML=`<div class="top"><button id="quit">‹ Valikko</button><span>${st.i+1} / ${tot} · ${st.score} oikein</span></div>
 <div class="bar"><i style="width:${st.i/tot*100}%"></i></div>
 <div class="card">${q}<div class="opts">${opts.map(o=>`<button class="opt">${o}</button>`).join("")}</div><div class="info" id="info"></div></div>`;
 document.getElementById("quit").onclick=home;
 app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>answer(b,p));
}
function answer(btn,p){
 const ok=btn.textContent===st.correct;
 app.querySelectorAll(".opt").forEach(b=>{b.disabled=true;if(b.textContent===st.correct)b.classList.add("ok")});
 if(ok)st.score++;else{btn.classList.add("bad");st.miss.push(p)}
 const pa=PARTY[p[3]];const last=st.i===st.list.length-1;
 const info=document.getElementById("info");
 info.innerHTML=`<div class="verdict ${ok?"ok":"bad"}">${ok?"Oikein!":"Väärin."}</div>
 <h3>${p[0]}. ${p[1]}</h3><div class="meta">${p[2]}<span class="party" style="background:${pa[1]}">${pa[0]}</span></div>
 <div>${(()=>{const a=[p[4],...(F[p[0]]||[])];return a[rnd(a.length)]})()}</div>
 <a href="https://${document.documentElement.lang||"fi"}.wikipedia.org/wiki/Special:Search?search=${encodeURIComponent(p[1])}" target="_blank" rel="noopener">Lue lisää ja katso kuva Wikipediasta ›</a>
 <button class="next" id="next">${last?"Katso tulos":"Seuraava ›"}</button>`;
 info.classList.add("show");
 document.getElementById("next").onclick=()=>{st.i++;st.i<st.list.length?ask():end()};
 info.scrollIntoView({behavior:"smooth",block:"nearest"});
}
function end(){
 const tot=st.list.length,pct=Math.round(st.score/tot*100);setBest(st.m,pct);const q=qualifies(st.m,st.score);let last="";try{last=localStorage.getItem("pv_name")||""}catch(e){}
 const msg=pct===100?"Täydellinen! 🇺🇸":pct>=80?"Erinomaista!":pct>=50?"Hyvä suoritus!":"Harjoitus tekee mestarin.";
 app.innerHTML=`<div class="card end"><div class="big">${st.score} / ${tot}</div><div class="q">${msg}</div>
 ${st.miss.length?`<div class="miss"><b>Kertaa nämä:</b><ul>${st.miss.map(p=>`<li>${p[0]}. ${p[1]} (${p[2]})</li>`).join("")}</ul></div>`:""}
 ${q?`<form class="entry" id="ef"><b>🏆 Pääsit top 10 -listalle!</b><br><span style="color:var(--mut);font-size:.9rem">Kirjoita nimesi:</span><input id="nm" maxlength="16" autocomplete="off" placeholder="Nimi" value="${esc(last)}"><button class="next" type="submit">Tallenna</button></form>`:""}
 <button class="next" id="again">Pelaa uudelleen</button><button class="next" id="lbb" style="background:transparent;color:var(--navy);border:1.5px solid var(--line)">🏆 Tulokset</button><button class="next" id="menu" style="background:transparent;color:var(--navy);border:1.5px solid var(--line)">Valikkoon</button></div>`;
 document.getElementById("lbb").onclick=()=>board(st.m);
 if(q){const f=document.getElementById("ef");f.onsubmit=ev=>{ev.preventDefault();const n=document.getElementById("nm").value.trim()||"Nimetön";try{localStorage.setItem("pv_name",n)}catch(e){}const id=addLB(st.m,n,st.score,tot);board(st.m,id)}}
 document.getElementById("again").onclick=()=>start(st.m);document.getElementById("menu").onclick=home;
}
home();
</script><script src="i18n.js"></script>
</body></html>
