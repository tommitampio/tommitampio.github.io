<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:#1a0d0d;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;touch-action:none}
#app{display:flex;flex-direction:column;height:100%}
#top{display:flex;align-items:center;gap:6px;padding:6px;background:#2b1515;flex-wrap:wrap}
.ub{position:relative;width:54px;height:58px;border-radius:12px;border:2px solid #8a6a00;background:#f5c400;color:#222;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;cursor:pointer;padding:0;overflow:hidden}
.ub .ic{font-size:22px;line-height:1}
.ub .pr{font-size:11px}
.ub.off{filter:grayscale(.8) brightness(.7)}
.ub .bar{position:absolute;left:0;bottom:0;height:4px;background:#2a7;width:0}
.ub .cx{position:absolute;top:-2px;left:-2px;width:24px;height:24px;border-radius:50%;background:#d22;color:#fff;font-size:13px;line-height:22px;font-weight:900;border:2px solid #fff;display:none;z-index:2}
.ub{overflow:visible}
.ub .cnt{position:absolute;top:1px;right:3px;font-size:11px;background:#222;color:#fff;border-radius:8px;padding:0 4px;display:none}
#stats{margin-left:auto;display:flex;gap:10px;align-items:center;font-weight:700;font-size:15px}
#stats span{background:#0006;padding:4px 8px;border-radius:8px;white-space:nowrap}
.sb{background:#3d2323;color:#fff;border:1px solid #6b3b3b;border-radius:10px;padding:8px 10px;font-weight:700;font-size:14px;cursor:pointer}
.sb.on{background:#f5c400;color:#222;border-color:#8a6a00}
#wrap{flex:1;position:relative;min-height:0}
canvas#c{position:absolute;inset:0;width:100%;height:100%;display:block}
#bottom{display:flex;align-items:center;gap:6px;padding:6px;background:#2b1515;flex-wrap:wrap}
#mini{flex:1;height:34px;border-radius:6px;background:#173;cursor:pointer;min-width:80px}
.ov{position:absolute;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;z-index:5;padding:12px}
.panel{background:#2b1515;border:2px solid #f5c400;border-radius:16px;padding:18px;max-width:440px;width:100%;max-height:100%;overflow:auto;text-align:center}
.panel h1{margin:0 0 4px;font-size:30px;color:#f5c400;letter-spacing:1px}
.panel p{margin:6px 0 12px;line-height:1.4;font-size:14px;color:#eee}
.big{display:block;width:100%;margin:8px 0;padding:12px;border-radius:12px;border:none;background:#f5c400;color:#222;font-size:17px;font-weight:800;cursor:pointer}
.big.alt{background:#4a2a2a;color:#fff}
.row{display:flex;gap:6px;justify-content:center;margin:6px 0}
.row .sb{flex:1}
.shopi{display:flex;align-items:center;gap:8px;background:#0004;border-radius:10px;padding:8px;margin:6px 0;text-align:left}
.shopi .t{flex:1;font-size:14px}
.shopi .t small{display:block;color:#ccc;font-weight:400}
.lv{color:#f5c400;font-size:12px}
.shopg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.card{background:#0005;border-radius:14px;padding:10px 6px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;border:2px solid #0000}
.card.can{border-color:#f5c400}
.card svg{width:68px;height:68px}
.card .nm{font-size:12px;color:#ddd;font-weight:700}
.card .ef{font-size:15px;font-weight:800;color:#fff}
.pips{display:flex;gap:3px}.pips i{width:9px;height:9px;border-radius:50%;background:#555;display:block}.pips i.f{background:#f5c400}
.card .sb{width:100%;margin-top:2px}
#intro{position:fixed;inset:0;z-index:20;background:#000;cursor:pointer;overflow:hidden}
#intro canvas{position:absolute;inset:0;width:100%;height:100%}
#introTxt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;padding:4vh 16px 0;text-align:center;pointer-events:none}
#introTxt .wel{font-size:clamp(15px,2.6vw,22px);color:#fff;letter-spacing:3px;text-transform:uppercase;opacity:0;animation:fin 1s .2s forwards;text-shadow:0 2px 6px #000}
#introTxt h1{margin:2px 0 4px;font-size:clamp(30px,7vw,64px);color:#f5c400;text-shadow:0 4px 0 #7a5a00,0 0 24px #f5c40088;opacity:0;animation:pop .9s .6s forwards;line-height:1.05}
#introTxt h1 span{display:block;font-size:.55em;letter-spacing:.35em}
#introTxt .ln{font-size:clamp(13px,2.3vw,19px);color:#fff;max-width:640px;margin:2px 0;opacity:0;text-shadow:0 2px 6px #000}
#introGo{margin-top:10px;opacity:0;animation:fin 1s forwards,pulse 1.4s infinite;pointer-events:auto;background:#f5c400;color:#222;border:none;border-radius:999px;padding:12px 28px;font-size:clamp(16px,2.6vw,22px);font-weight:900;box-shadow:0 4px 0 #8a6a00}
@keyframes fin{to{opacity:1}}@keyframes pop{0%{opacity:0;transform:scale(.4)}70%{opacity:1;transform:scale(1.08)}100%{opacity:1;transform:scale(1)}}
@keyframes pulse{50%{transform:scale(1.07)}}
.zb{background:#3d2323;color:#fff;border:1px solid #6b3b3b;border-radius:10px;width:34px;padding:6px 0;font-size:15px;font-weight:900;cursor:pointer}
#bPause{background:#3d2323;color:#f5c400;border:1px solid #6b3b3b;border-radius:10px;padding:6px 10px;font-size:14px;font-weight:900;letter-spacing:-2px;cursor:pointer}
#langs{position:absolute;top:10px;right:10px;z-index:6;display:flex;gap:4px}
#langs button{background:#0007;border:1px solid #f5c40066;color:#fff;border-radius:8px;padding:4px 7px;font-size:12px;cursor:pointer}
#langs button.on{background:#f5c400;color:#222}
.hide{display:none!important}
@media (max-width:600px){#mini{order:9;flex-basis:100%;height:26px}#bottom .sb{flex:1}.ub{width:46px;height:52px}.ub .ic{font-size:19px}#stats{font-size:13px}.sb{padding:7px 8px;font-size:13px}}
</style>
</head>

function tone(type,f1,f2,dur,vol,when,dest,filt){
  const c=AU.ctx,t0=when||c.currentTime,o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(f1,t0);

  let n=o;if(filt){const f=c.createBiquadFilter();f.type="lowpass";f.frequency.value=filt;o.connect(f);n=f;}n.connect(g);g.connect(dest||AU.fx);o.start(t0);o.stop(t0+dur+0.05);}
function noise(dur,vol,ftype,freq,when,dest){
  const c=AU.ctx,t0=when||c.currentTime,src=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();src.buffer=AU.noise;f.type=ftype;f.frequency.value=freq;
  g.gain.setValueAtTime(vol,t0);g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);src.connect(f);f.connect(g);g.connect(dest||AU.fx);src.start(t0,Math.random()*0.5);src.stop(t0+dur+0.05);}
function sfx(name,x){
  if(!AU.ctx||!save.sfx)return;

  const now=AU.ctx.currentTime,gap={hit:0.07,arrow:0.09,coin:0.12,thud:0.25,spawn:0.1,pop:0.08}[name]||0;

  const v=0.7+Math.random()*0.3;
  switch(name){
    case"hit":noise(0.07,0.35*v,"bandpass",1200+Math.random()*900);tone("square",220,110,0.05,0.05);break;
    case"arrow":tone("triangle",1100,320,0.13,0.10*v);break;
    case"coin":tone("square",1320,0,0.06,0.05);tone("square",1980,0,0.12,0.05,now+0.06);break;

    case"pop":tone("sine",700,1400,0.08,0.08);noise(0.05,0.12,"highpass",3000);break;
  }

function n2f(m){return 440*Math.pow(2,(m-69)/12);}

function schedMusic(){
  const c=AU.ctx;if(!c||!save.music)return;const sd=60/92/4;
  if(AU.next<c.currentTime)AU.next=c.currentTime+0.05;
  while(AU.next<c.currentTime+0.3){
    const st=AU.step%128,bar=Math.floor(st/16),b=st%16,t0=AU.next,D=AU.mus,r=ROOT[bar];
    if(b===0)tone("sine",90,50,0.25,0.22,t0,D);
    if(b===2||b===6||b===10||b===14)noise(0.05,0.035,"highpass",6500,t0,D);
    if(b===0||b===8)tone("triangle",n2f(r-12),0,0.5,0.2,t0,D);
    if(b===6||b===14)tone("triangle",n2f(r-12+7),0,0.25,0.12,t0,D);
    if(b===4||b===12)CHORD[bar].forEach(iv=>tone("sine",n2f(r+12+iv),0,0.3,0.03,t0,D));
    if(b===0)CHORD[bar].forEach(iv=>tone("sine",n2f(r+iv),0,sd*15,0.018,t0,D,1200));
    const m=MEL[st];if(m)mallet(n2f(m),t0,0.07);
    AU.next+=sd;AU.step++;}
}

function step(dt){
  if(!G||G.fake)return;
  G.time+=dt;
  // koulutusjonot
  G.teams.forEach((tm,i)=>{for(const k of ORDER){const q=tm.q[k];if(q.length){q[0]-=dt;if(q[0]<=0){q.shift();spawn(i,k);}}}});
  // tekoäly
  G.aiT-=dt;if(G.aiT<=0&&G.winner<0){G.aiT=cfg().think;aiThink();}
  for(const u of G.units){if(u.dead){u.deadT+=dt;if(u.fvx!=null&&!u.landed){u.fx+=u.fvx*dt;u.fy+=u.fvy*dt;u.fvy+=900*dt;u.rot+=u.frot*dt;if(u.fy>=0&&u.fvy>0){u.landed=1;gibs(Object.assign({},u,{x:u.x+u.fx}));u.deadT=3.3;}}continue;}
    if(u.type==="miner"&&u.carrying&&u.team===0&&Math.random()<dt*0.9){fx();G.notes.push({x:u.x,y:u.y-48,t:0,c:Math.random()<0.5?"♪":"♫"});}
    if(u.type==="giant"&&u.moving){const st=Math.floor(u.phase/Math.PI);if(st!==u.lastStep){u.lastStep=st;G.dust.push({x:u.x+u.face*6,y:u.y,vx:-u.face*20,vy:-10,t:0,life:0.6,r:4});}}u.atk=Math.max(0,u.atk-dt);if(u.spin>0)u.spin=Math.max(0,u.spin-dt);
    if(G.winner>=0&&u.team===G.winner&&!(u.spin>0)&&Math.random()<dt*0.7)u.spin=SPIN;u.moving=false;u.hidden=false;
    if(G.teams[u.team].mode==="retreat")goHide(u,dt);
    else if(u.type==="miner")updMiner(u,dt);else updFighter(u,dt);
    u.y+=(u.ty-u.y)*Math.min(1,dt*2);if(u.moving)u.phase+=dt*UT[u.type].spd/6;}
  G.units=G.units.filter(u=>!u.dead||u.deadT<3.2);
  stepFx(dt);stepComic(dt);
  // linnan jousimiehet paaluaidan luona
  for(const S of G.statues){S.shake=Math.max(0,S.shake-dt);if(!S.alive){S.guarded=false;continue;}
    const ret=G.teams[S.team].mode==="retreat";let ar=0,ot=0;
    if(ret)for(const u of G.units)if(u.team===S.team&&u.hidden){if(u.type==="archer")ar++;else ot++;}
    S.guarded=ret&&ar+ot>0;
    const n=guardCount(S,ar);S.nGuards=n;const gs=guards(S);
    for(let i=0;i<n;i++){const g=gs[i];g.atk=Math.max(0,g.atk-dt);g.cd-=dt;if(g.cd>0)continue;
      const e=nearestEnemy(S.team,S.x,ret?480:420);
      if(!e){g.cd=0.3;continue;}
      g.cd=(ret?0.9:1.5)*(0.85+Math.random()*0.3);g.atk=0.35;g.face=Math.sign(e.x-g.x)||1;
      shoot(S.team,g.x+g.face*10,g.y-27,e,ret?15+ot*4.5/n:12);}
  }
  for(const S of G.statues)if(G.teams[S.team].mode!=="retreat")S.guarded=false;
  // nuolet
  for(const a of G.arrows){a.t+=dt;a.x+=a.vx*dt;a.y+=a.vy*dt;a.vy+=700*dt;
    if(a.t>=a.T){a.done=true;const tg=a.tg;if(tg&&!tg.dead&&!tg.hidden&&(tg.hp>0)&&Math.abs((tg.x)-a.x)<35)hurt(tg,a.dmg,a.team,"arrow");}}
  G.arrows=G.arrows.filter(a=>!a.done);
  // romahdus
  for(const p of G.pieces){p.vy+=900*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.a+=p.va*dt;
    if(p.y>p.gy){p.y=p.gy;p.vy*=-0.25;p.vx*=0.6;p.va*=0.5;if(Math.abs(p.vy)<30)p.vy=0;}}
  for(const d of G.dust){d.t+=dt;d.x+=d.vx*dt;d.y+=d.vy*dt;d.vy-=10*dt;}
  G.dust=G.dust.filter(d=>d.t<d.life);
  for(const f of G.floats){f.t+=dt;f.y-=25*dt;}
  G.floats=G.floats.filter(f=>f.t<1.2);
  if(G.overT>=0){G.overT+=dt;if(G.overT>3.2&&state==="play")endGame();}
}
function nearestEnemy(team,x,maxD){let best=null,bd=maxD;
  for(const u of G.units){if(u.team===team||u.dead||u.hidden)continue;const d=Math.abs(u.x-x);if(d<bd){bd=d;best=u;}}return best;}
function moveTo(u,tx,dt){const d=tx-u.x;if(Math.abs(d)<3)return true;const s=UT[u.type].spd*dt;u.x+=Math.sign(d)*Math.min(Math.abs(d),s);u.face=Math.sign(d);u.moving=true;return false;}
const MSLOT=[{dx:-28,dy:-7},{dx:28,dy:-7},{dx:-22,dy:9},{dx:22,dy:9}];
function freeMine(u){if(u.mine){const i=u.mine.slots.indexOf(u.id);if(i>=0)u.mine.slots[i]=null;u.mine=null;}}
function guards(S){
  if(!S.guards){S.guards=[];const dir=S.team?-1:1;
    for(let i=0;i<8;i++)S.guards.push({x:S.x-dir*(82+(i%2)*16-(i>>1)*3),y:LANE0+6+((i*13)%62),cd:Math.random(),atk:0,face:dir});}
  return S.guards;}
function guardCount(S,hiddenArchers){return Math.min(8,2+(S.tower||0)+(hiddenArchers||0));}
function goHide(u,dt){
  const S=G.statues[u.team],dir=u.team?-1:1,tm=G.teams[u.team];
  if(u.mine){freeMine(u);u.state="toMine";}
  if(u.state==="mining")u.state="toMine";
  const hx=Math.max(20,Math.min(W-20,S.x-dir*(30+(u.id%7)*7)));
  if(u.carrying&&Math.abs(u.x-S.x)<40){const g=Math.round(u.carrying*tm.income);tm.gold+=g;u.carrying=0;u.state="toMine";if(u.team===0)G.floats.push({x:u.x,y:u.y-50,txt:"+"+g,col:"#ffe14d",t:0});}
  u.ty=LANE0+10+((u.id*23)%40);

}
function updMiner(u,dt){
  const S=G.statues[u.team],tm=G.teams[u.team],dir=u.team?-1:1;
  if(u.state==="toMine"){
    if(!u.mine){let best=null,bd=1e9;for(const m of G.mines){if(m.slots.indexOf(null)<0)continue;const d=Math.abs(m.x-S.x);if(d<bd){bd=d;best=m;}}
      if(!best){u.ty=LANE0+((u.id*37)%60);if(moveTo(u,S.x+dir*(75+(u.id%8)*16),dt))u.face=dir;return;}
      const i=best.slots.indexOf(null);best.slots[i]=u.id;u.mine=best;u.slot=i;u.ty=best.y+MSLOT[i].dy;}
    if(moveTo(u,u.mine.x+MSLOT[u.slot].dx,dt)){u.state="mining";u.timer=MINE_TIME;u.face=MSLOT[u.slot].dx>0?-1:1;}
  }else if(u.state==="mining"){u.timer-=dt;u.phase+=dt*7;u.atk=0.35*(0.5+0.5*Math.sin(u.phase));
    if(u.timer<=0){u.carrying=tm.carry;freeMine(u);u.state="toBase";u.ty=LANE0+Math.random()*(LANE1-LANE0);}
  }else if(u.state==="toBase"){
    if(moveTo(u,S.x+dir*35,dt)){const g=Math.round(u.carrying*tm.income);tm.gold+=g;u.carrying=0;u.state="toMine";
      if(u.team===0)sfx("coin");if(u.team===0)G.floats.push({x:u.x,y:u.y-50,txt:"+"+g,col:"#ffe14d",t:0});}
  }
}
function updFighter(u,dt){
  const d=UT[u.type],tm=G.teams[u.team],S=G.statues[u.team],E=G.statues[1-u.team],dir=u.team?-1:1;
  const aggro=d.ranged?d.range+30:230;
  let tg=nearestEnemy(u.team,u.x,aggro);
  if(tm.mode==="defend"&&tg&&Math.abs(tg.x-S.x)>700)tg=null;

    if(dist>d.range)moveTo(u,tg.x-Math.sign(tg.x-u.x)*(d.range*0.8-(u.id%4)*3),dt);else{u.face=Math.sign(tg.x-u.x)||dir;attack(u,tg,dt);}return;}

}
function attack(u,tg,dt){

function hurt(tg,dmg,from,kind){

    for(const th of[0.5,0.25])if(f0>th&&f1<=th&&tg.hp>0){banner(tg.team===0?t("bCrackMine"):t("bCrackEnemy"),tg.team===0?"#ff5a5a":"#f5c400");G.shk=Math.max(G.shk||0,0.5);
      for(let i=0;i<3;i++)G.pieces.push({x:tg.x+(Math.random()-0.5)*30,y:GY-150*tg.size,len:8+Math.random()*8,w:6,col:"#8e8e8e",a:Math.random()*3,vx:(Math.random()-0.5)*120,vy:-60,va:(Math.random()-0.5)*8,gy:GY-4+Math.random()*12});}tg.shake=0.15;sfx("thud",tg.x);

    if(tg.hp<=0){tg.hp=0;collapse(tg);}return;}
  const d=UT[tg.type];tg.hp-=dmg*(1-(d.armor||0));

function fx(){if(!G.gibs){G.gibs=[];G.ghosts=[];G.sparks=[];G.notes=[];G.banners=[];}}
function banner(txt,col){fx();if(G.banners.length>2)return;G.banners.push({txt,col,t:0});}
function killUnit(u,dmg){
  fx();u.dead=true;freeMine(u);
  if(u.type==="miner"){G.teams[u.team].gold+=125;if(u.team===0){const S=G.statues[0];G.floats.push({x:S.x+70,y:GY-130,txt:"+125 💰",col:"#ffe14d",t:0});}}const dir=u.team===0?-1:1,big=dmg>=50;
  if(!G.firstBlood){G.firstBlood=1;banner(t("bFirst"),"#ff5a5a");}
  const kt=1-u.team;G.kills=G.kills||[[],[]];const L=G.kills[kt];L.push(G.time);while(L.length&&G.time-L[0]>1.2)L.shift();
  if(L.length>=3&&(!G.lastMulti||G.time-G.lastMulti>4)){G.lastMulti=G.time;banner(kt===0?t("bMulti"):t("bMultiE"),kt===0?"#f5c400":"#ff5a5a");G.shk=Math.max(G.shk||0,0.4);}

  if(big||Math.random()<0.45){u.deadT=0;u.fx=0;u.fy=0;u.fvx=dir*(big?280:130)*(0.7+Math.random()*0.6);u.fvy=-(big?360:220)*(0.7+Math.random()*0.5);u.rot=0;u.frot=-dir*u.face*(7+Math.random()*7);}
  else{gibs(u);u.deadT=3.3;}
}
function gibs(u){
  const s=UT[u.type].size,c=TCOL[u.type][u.team],dir=u.team===0?-1:1;
  const W2={miner:["#8a6a3a",14],sword:["#dfe4e8",17],archer:["#7a4a1a",18],spear:["#8a6a3a",32],giant:["#e02424",30]}[u.type];
  const parts=[["h",5.6],["l",14],["l",9],["l",9],["l",9],["l",9],["w",W2[1],W2[0]]];
  for(const pp of parts){G.gibs.push({k:pp[0],len:pp[1]*s,col:pp[2]||c,x:u.x,y:u.y-20*s,vx:dir*(40+Math.random()*160)+(Math.random()-0.5)*80,vy:-(150+Math.random()*220),a:Math.random()*6,va:(Math.random()-0.5)*20,gy:u.y+(Math.random()-0.5)*6,t:0,w:2.8*s});}
  poof(u.x,u.y-20*s,u.team);

  // vaahto ja kolikot
  for(const f of FIN.foam){f.t+=dt;f.vy+=260*dt*kp;f.x+=f.vx*dt;f.y+=f.vy*dt;c.globalAlpha=Math.max(0,1-f.t/0.9);c.fillStyle="#fffbe8";c.beginPath();c.arc(f.x,f.y,(1.5+f.t*3)*kp*0.7,0,7);c.fill();}
  c.globalAlpha=1;FIN.foam=FIN.foam.filter(f=>f.t<0.9);
  for(const q of FIN.coins){q.t+=dt;q.vy+=300*dt*kp;q.x+=q.vx*dt;q.y+=q.vy*dt;q.p+=dt*12;c.fillStyle="#f5c400";c.strokeStyle="#8a6a00";c.lineWidth=1;c.beginPath();c.ellipse(q.x,q.y,4*kp*Math.abs(Math.cos(q.p))+0.5,4*kp,0,0,7);c.fill();c.stroke();}
  FIN.coins=FIN.coins.filter(q=>q.t<1.6);
  // konfetti
  if(FIN.conf.length<120)FIN.conf.push({x:Math.random()*Wd,y:-10,vy:40+Math.random()*50,vx:(Math.random()-0.5)*30,a:Math.random()*6,va:(Math.random()-0.5)*8,col:["#f5c400","#ff5a5a","#5ad1ff","#7dff7a","#ff9cf0"][Math.floor(Math.random()*5)]});
  for(const q of FIN.conf){q.y+=q.vy*dt;q.x+=q.vx*dt+Math.sin(q.y/30)*0.5;q.a+=q.va*dt;c.save();c.translate(q.x,q.y);c.rotate(q.a);c.fillStyle=q.col;c.fillRect(-3.5,-1.8,7,3.6);c.restore();}
  FIN.conf=FIN.conf.filter(q=>q.y<Hd+10);
}

let fwPrev=0;
function drawFw(now){
  fwAnim=requestAnimationFrame(drawFw);const cv2=$("fw"),r=cv2.getBoundingClientRect(),d=window.devicePixelRatio||1;
  if(cv2.width!==Math.round(r.width*d)){cv2.width=r.width*d;cv2.height=r.height*d;}
  if(!cgT0){cgT0=now;fwPrev=now;}const T=(now-cgT0)/1000,dt=Math.min(0.05,(now-fwPrev)/1000);fwPrev=now;
  const c=cv2.getContext("2d");c.setTransform(d,0,0,d,0,0);if(!FIN||!G||!G.fake)initFinale();G.time=T;
  ctx=c;try{drawFinale(c,r.width,r.height,T,dt);}finally{ctx=mainCtx;}
}

function renderShop(){
  $("shTitle").textContent=t("shop");$("shCoins").textContent="🪙 "+t("coins")+": "+save.coins;
  const L=$("shList");L.innerHTML="";L.className="shopg";
  for(const k in SHOP){const lv=save.up[k],it=SHOP[k],full=lv>=it.max,cost=it.cost[lv],can=!full&&save.coins>=cost;
    const c=document.createElement("div");c.className="card"+(can?" can":"");c.title=t("up")[k][1];
    let pips="";for(let i=0;i<it.max;i++)pips+=`<i class="${i<lv?"f":""}"></i>`;
    c.innerHTML=SHOP_ICON[k]+`<div class="ef">${SHOP_EFF[k]}</div><div class="nm">${t("up")[k][0]}</div><div class="pips">${pips}</div>`;
    const b=document.createElement("button");b.className="sb"+(can?" on":"");b.textContent=full?"✓ "+t("max"):"🪙 "+cost;if(!can&&!full)b.style.opacity=.55;
    b.onclick=()=>{if(!can)return;save.coins-=cost;save.up[k]++;persist();renderShop();};c.appendChild(b);L.appendChild(c);}
  $("bShopBack").textContent=t("back");
}
function renderAudio(){document.querySelectorAll(".aud").forEach(b=>{const k=b.dataset.k,on=!!save[k];
  b.textContent=(on?"☑ ":"☐ ")+(k==="music"?"🎵 "+t("music"):"🔊 "+t("sounds"));b.classList.toggle("on",on);});}
document.querySelectorAll(".aud").forEach(b=>b.addEventListener("click",()=>{const k=b.dataset.k;save[k]=!save[k];persist();audioInit();setAudio();renderAudio();if(k==="sfx"&&save.sfx)sfx("click");}));
function applyLang(){
  document.documentElement.lang=lang;
  document.querySelectorAll("#langs button").forEach(b=>b.classList.toggle("on",b.dataset.l===lang));
  renderAudio();$("mSub").textContent=t("sub");$("bPlay").textContent=t("quick");$("bCamp").textContent=t("campaign")+(save.camp>0&&save.camp<LEVELS.length?"  ("+save.camp+"/"+LEVELS.length+")":save.camp>=LEVELS.length?"  👑":"");$("bShop").textContent="🗿 "+t("shop");$("mHelp").textContent=t("help");
  $("mCoins").textContent="🪙 "+t("coins")+": "+save.coins;
  const dr=$("diffRow");dr.innerHTML="";for(const k of ["easy","normal","hard"]){const b=document.createElement("button");b.className="sb"+(save.diff===k?" on":"");b.textContent=t(k);
    b.onclick=()=>{save.diff=k;persist();applyLang();};dr.appendChild(b);}
  $("bDef").textContent=t("defend");$("bRet").textContent=t("retreat");$("bAtk").innerHTML=SWORDS_SVG+" "+t("attack").replace("⚔ ","");$("bStat").title=t("statTip");
  $("pTitle").textContent=t("paused");$("pLbl").textContent=t("pauseBtn");$("bResume").textContent="▶ "+t("resume");$("bQuit").textContent=t("saveQuit");$("bSaveSlots").textContent=t("saveBtn");$("bLoad").textContent=t("loadBtn");if(!$("slots").classList.contains("hide"))renderSlots();$("pAuto").textContent=t("autosave");$("bCont").textContent=t("cont");$("bCont").classList.toggle("hide",!hasSaved());$("bReset").textContent=t("reset");$("cTitle").textContent=t("reset");$("cText").textContent=t("resetQ");$("bYes").textContent=t("yes");$("bNo").textContent=t("cancel");
  $("bAgain").textContent=t("again");$("bMenu").textContent=t("menu");
  for(const k of ORDER)ubtns[k].title=t("units")[k]+" – "+UT[k].cost;
  if(!$("shop").classList.contains("hide"))renderShop();
  if(G&&state==="over"){$("oTitle").textContent=G.winner===0?t("win"):t("lose");}

let popFlash=0;
function popFull(){popFlash=1.5;const S=G.statues[0];G.floats.push({x:Math.max(S.x+60,camX+viewW()/2),y:GY-120,txt:"👥 "+t("popFull"),col:"#ff6b6b",t:0});}
let lastInGame=null;
function updUI(){
  $("langs").classList.toggle("hide",state!=="menu");
  const inGame=(state==="play"||state==="paused"||state==="over")&&!!G;if(inGame!==lastInGame){lastInGame=inGame;$("top").style.display=inGame?"":"none";$("bottom").style.display=inGame?"":"none";resize();}$("bPause").classList.toggle("hide",state!=="play"||!G||G.winner>=0);
  if(!G||G.fake)return;const tm=G.teams[0],pop=popOf(0);
  $("sGold").textContent="💰 "+Math.floor(tm.gold);$("sPop").textContent="👥 "+pop+"/"+POPMAX;popFlash=Math.max(0,popFlash-1/60);$("sPop").style.background=(pop>=POPMAX||popFlash>0)?"#a22":"";
  for(const k of ORDER){const b=ubtns[k],q=tm.q[k];b.classList.toggle("off",tm.gold<UT[k].cost||pop+UT[k].pop>POPMAX);
    const cnt=b.querySelector(".cnt");cnt.style.display=q.length?"block":"none";b.querySelector(".cx").style.display=q.length?"block":"none";cnt.textContent=q.length;
    b.querySelector(".bar").style.width=q.length?(100*(1-q[0]/UT[k].train))+"%":"0";}
  $("bDef").classList.toggle("on",tm.mode==="defend");$("bAtk").classList.toggle("on",tm.mode==="attack");$("bRet").classList.toggle("on",tm.mode==="retreat");
  const n=tm.statUps;$("bStat").textContent=n>=3?"🗿 ✓":"🗿+ "+STAT_COST[n];$("bStat").classList.toggle("on",n<3&&tm.gold>=STAT_COST[n]);
}

/* ===== ruudun vetäminen ja pienoiskartta ===== */
let drag=null;
function setZoom(z,cx){const old=viewW(),c=camX+(cx!=null?cx/scale:old/2);save.zoom=Math.max(1,Math.min(2.2,z));calcView();camX=c-(cx!=null?cx/scale:viewW()/2);clampCam();try{persist()}catch(e){}}
$("bZin").onclick=()=>setZoom((save.zoom||1)*1.2);$("bZout").onclick=()=>setZoom((save.zoom||1)/1.2);
const ptrs=new Map();let pinch=null;
cv.addEventListener("pointerdown",e=>{ptrs.set(e.pointerId,e.clientX);cv.setPointerCapture(e.pointerId);
  if(ptrs.size===2){const xs=[...ptrs.values()];pinch={d:Math.abs(xs[0]-xs[1])||1,z:save.zoom||1};drag=null;}else drag={x:e.clientX,cam:camX};});
cv.addEventListener("pointermove",e=>{if(!ptrs.has(e.pointerId))return;ptrs.set(e.pointerId,e.clientX);
  if(pinch&&ptrs.size===2){const xs=[...ptrs.values()],r=cv.getBoundingClientRect();setZoom(pinch.z*(Math.abs(xs[0]-xs[1])||1)/pinch.d,(xs[0]+xs[1])/2-r.left);return;}
  if(!drag)return;camX=drag.cam-(e.clientX-drag.x)/scale;clampCam();});
const pend=e=>{ptrs.delete(e.pointerId);if(ptrs.size<2)pinch=null;drag=null;};
cv.addEventListener("pointerup",pend);cv.addEventListener("pointercancel",pend);
cv.addEventListener("wheel",e=>{if(e.ctrlKey){setZoom((save.zoom||1)*(e.deltaY<0?1.1:1/1.1));}else{camX+=(e.deltaX||e.deltaY)/scale;clampCam();}e.preventDefault();},{passive:false});
const mini=$("mini");let mdrag=false;
function miniJump(e){const r=mini.getBoundingClientRect();camX=(e.clientX-r.left)/r.width*W-viewW()/2;clampCam();}
mini.addEventListener("pointerdown",e=>{mdrag=true;mini.setPointerCapture(e.pointerId);miniJump(e);});
mini.addEventListener("pointermove",e=>{if(mdrag)miniJump(e);});
mini.addEventListener("pointerup",()=>mdrag=false);
const keys={};addEventListener("keydown",e=>{keys[e.key]=1;if(e.key==="p"||e.key==="P"||e.key==="Escape"||e.key===" "){e.preventDefault();state==="paused"?resumeGame():pauseGame();return;}const i=["1","2","3","4","5"].indexOf(e.key);if(i>=0&&state==="play")buy(0,ORDER[i]);
  const j=["!","\"","#","¤","%"].indexOf(e.key);if(j>=0&&state==="play")cancelBuy(0,ORDER[j]);
  if(e.key==="d"||e.key==="D")$("bDef").click();if(e.key==="a"||e.key==="A")$("bAtk").click();});
addEventListener("keyup",e=>keys[e.key]=0);
addEventListener("resize",resize);

/* ===== pääsilmukka ===== */
let last=performance.now(),acc=0;
function loop(now){
  let dt=Math.min(0.1,(now-last)/1000);last=now;
  if(keys.ArrowLeft)camX-=600*dt;if(keys.ArrowRight)camX+=600*dt;if(keys.ArrowLeft||keys.ArrowRight)clampCam();
  if(G){if(G.slow>0)G.slow-=dt;if(G.shk>0)G.shk=Math.max(0,G.shk-dt*1.5);if(G.flash>0)G.flash=Math.max(0,G.flash-dt*1.5);}
  if(state==="play"||(state==="over"&&G)){acc+=dt*speed*(G&&G.slow>0?0.3:1);while(acc>=1/60){step(1/60);acc-=1/60;}}
  if(state==="play"){saveT+=dt;if(saveT>5){saveT=0;saveGame();}}
  draw();drawMini();updUI();requestAnimationFrame(loop);
}

state="intro";
(function intro(){
  $("iWel").textContent=t("introWel");$("introGo").textContent=t("introGo");
  const L=t("introLines");L.forEach((x,i)=>{const d=document.createElement("div");d.className="ln";d.textContent=x;d.style.animation=`fin .9s ${1.6+i*0.9}s forwards`;$("iLines").appendChild(d);});
  $("introGo").style.animationDelay=(1.6+L.length*0.9)+"s, "+(2.4+L.length*0.9)+"s";
  let t0=0,an=0;const cv3=$("introc");
  function frame(now){an=requestAnimationFrame(frame);if(!t0)t0=now;const T=(now-t0)/1000,r=cv3.getBoundingClientRect(),d=window.devicePixelRatio||1;
    if(cv3.width!==Math.round(r.width*d)){cv3.width=r.width*d;cv3.height=r.height*d;}
    const c=cv3.getContext("2d"),Wd=r.width,Hd=r.height;c.setTransform(d,0,0,d,0,0);
    const g=c.createLinearGradient(0,0,0,Hd);g.addColorStop(0,"#1a0a2e");g.addColorStop(0.55,"#8a1a1a");g.addColorStop(0.8,"#e0702a");c.fillStyle=g;c.fillRect(0,0,Wd,Hd);
    const gy=Hd*(Hd>Wd?0.8:0.9);c.fillStyle="#f7c96a";c.beginPath();c.arc(Wd/2,gy,Math.min(Wd,Hd)*0.16,Math.PI,0);c.fill();
    c.fillStyle="#2a1018";c.beginPath();c.moveTo(0,gy);for(let x=0;x<=Wd;x+=30)c.lineTo(x,gy-14-10*Math.sin(x/70));c.lineTo(Wd,Hd);c.lineTo(0,Hd);c.fill();
    c.fillStyle="#120608";c.fillRect(0,gy,Wd,Hd-gy);
    const k=Math.max(0.7,Math.min(Hd/330,Wd/430));
    miniStatue(c,Wd*0.1,gy,0.9*k,0,false);miniStatue(c,Wd*0.9,gy,0.9*k,0,false);
    const gap=46*k,n=Math.ceil(Wd*0.35/gap);
    for(let i=0;i<n;i++){const x=Wd*0.16+((T*30*k+i*gap)%(Wd*0.32));stick(c,x,gy+6,0.9*k,T*3+i,i%3===0?"flag":"walk");}
    c.save();c.translate(Wd,0);c.scale(-1,1);for(let i=0;i<n;i++){const x=Wd*0.16+((T*30*k+i*gap)%(Wd*0.32));stick(c,x,gy+6,0.9*k,T*3+i+0.5,i%3===1?"flag":"walk");}c.restore();
  }
  an=requestAnimationFrame(frame);
  function go(){cancelAnimationFrame(an);$("intro").style.transition="opacity .5s";$("intro").style.opacity=0;setTimeout(()=>{$("intro").remove();showMenu();},500);}
  $("intro").addEventListener("click",go,{once:true});
})();
resize();applyLang();requestAnimationFrame(loop);
